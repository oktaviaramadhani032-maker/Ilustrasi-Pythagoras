&lt;link href=&quot;https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&amp;family=Lora:ital,wght@1,600&amp;family=Nunito:wght@400;600;700;800&amp;display=swap&quot; rel=&quot;stylesheet&quot;&gt;
&lt;style&gt;
body { margin: 0; }
button { font-family: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid #C9822B; outline-offset: 2px; }
button:disabled { cursor: default; }

.press { transition: transform .12s ease, box-shadow .15s ease, background-color .15s ease, border-color .15s ease, color .15s ease; }
.press:hover:not(:disabled) { transform: translateY(-1px); }
.press:active:not(:disabled) { transform: scale(.96); }
.btn { min-height: 44px; padding: 0 14px; border-radius: 12px; border: 2px solid #D9C48F; background: #FFFFFF; color: #6E1B1B; font-weight: 700; font-size: 15px; line-height: 20px; }
.btn:hover:not(:disabled) { background: #FFF6DC; }
.btn.on, .btn.on:hover:not(:disabled) { background: #2F5D3A; border-color: #2F5D3A; color: #FBF3DC; }

/* efek ledakan titik warna */
.burst { position: absolute; width: 0; height: 0; pointer-events: none; }
.arm { position: absolute; left: 0; top: 0; width: 0; height: 0; }
.dot { position: absolute; left: -5px; top: -5px; width: 10px; height: 10px; border-radius: 50%; opacity: 0; }
.arm:nth-child(even) .dot { width: 7px; height: 7px; left: -3.5px; top: -3.5px; }
.r0 { transform: rotate(0deg); }
.r1 { transform: rotate(30deg); }
.r2 { transform: rotate(60deg); }
.r3 { transform: rotate(90deg); }
.r4 { transform: rotate(120deg); }
.r5 { transform: rotate(150deg); }
.r6 { transform: rotate(180deg); }
.r7 { transform: rotate(210deg); }
.r8 { transform: rotate(240deg); }
.r9 { transform: rotate(270deg); }
.r10 { transform: rotate(300deg); }
.r11 { transform: rotate(330deg); }
.c0 .dot { background: #F2B01E; }
.c1 .dot { background: #2F5D3A; }
.c2 .dot { background: #B8520A; }
.c3 .dot { background: #2A63A8; }
.fxA .dot { animation: outA .85s ease-out both; }
.fxB .dot { animation: outB .85s ease-out both; }
@keyframes outA {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-96px) scale(.3); }
}
@keyframes outB {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-96px) scale(.3); }
}
.popA { animation: popA .45s cubic-bezier(.2, 1.5, .4, 1); }
.popB { animation: popB .45s cubic-bezier(.2, 1.5, .4, 1); }
@keyframes popA {
  0% { transform: scale(.94); }
  60% { transform: scale(1.04); }
  100% { transform: scale(1); }
}
@keyframes popB {
  0% { transform: scale(.94); }
  60% { transform: scale(1.04); }
  100% { transform: scale(1); }
}

/* ilustrasi */
.ang { fill: rgba(226, 169, 74, .4); stroke: #8A4B0F; transition: fill .25s ease, stroke .25s ease; }
.ang.right { fill: rgba(47, 93, 58, .32); stroke: #2F5D3A; }
.verdict { border-radius: 16px; padding: 14px 16px; border: 2px solid #D9C48F; background: #FFFFFF; display: flex; flex-direction: column; gap: 6px; }
.verdict.right { background: #DDEBCF; border-color: #2F5D3A; }
.verdict.wrong { background: #FFF1DA; border-color: #E2A94A; }

@media (prefers-reduced-motion: reduce) {

      const cur = this.S(st);
      const patch = { ang: v };
      if (v === 90 &amp;&amp; cur.ang !== 90) patch.fx = cur.fx + 1;
      return patch;
    });
  }

  renderVals() {
    const s = this.S(this.state);
    const particles = [];
    for (let i = 0; i &lt; 12; i++) {
      particles.push({ cls: &#x27;arm r&#x27; + i + &#x27; c&#x27; + (i % 4) });
    }

    const Ax = 215;
    const Ay = 335;
    const L = 190;
    const th = s.ang;
    const rad = th * Math.PI / 180;
    const cs = Math.cos(rad);
    const sn = Math.sin(rad);
    const Cx = Ax + L * cs;
    const Cy = Ay - L * sn;
    const f = (n) =&gt; n.toFixed(1);
    const right = th === 90;
    const kind = th &lt; 90 ? &#x27;lancip&#x27; : (right ? &#x27;siku&#x27; : &#x27;tumpul&#x27;);

    let angD;
    if (right) {
      angD = &#x27;M &#x27; + Ax + &#x27; &#x27; + Ay + &#x27; L &#x27; + (Ax + 30) + &#x27; &#x27; + Ay + &#x27; L &#x27; + (Ax + 30) + &#x27; &#x27; + (Ay - 30) + &#x27; L &#x27; + Ax + &#x27; &#x27; + (Ay - 30) + &#x27; Z&#x27;;
    } else {
      const r = 46;
      angD = &#x27;M &#x27; + Ax + &#x27; &#x27; + Ay + &#x27; L &#x27; + (Ax + r) + &#x27; &#x27; + Ay + &#x27; A &#x27; + r + &#x27; &#x27; + r + &#x27; 0 0 0 &#x27; + f(Ax + r * cs) + &#x27; &#x27; + f(Ay - r * sn) + &#x27; Z&#x27;;
    }
    const half = rad / 2;
    const lr = right ? 64 : 82;

    let chipTitle = &#x27;Sudut A lancip&#x27;;
    let chipDesc = &#x27;Besarnya kurang dari 90°, jadi ini bukan segitiga siku-siku.&#x27;;
    let chipThm = &#x27;Teorema Pythagoras belum bisa dipakai di sini.&#x27;;
    if (right) {
      chipTitle = &#x27;Sudut A tepat 90°&#x27;;
      chipDesc = &#x27;Inilah segitiga siku-siku. Sudut siku-siku diberi tanda kotak kecil.&#x27;;
      chipThm = &#x27;Teorema Pythagoras berlaku pada segitiga ini.&#x27;;
    } else if (kind === &#x27;tumpul&#x27;) {
      chipTitle = &#x27;Sudut A tumpul&#x27;;
      chipDesc = &#x27;Besarnya lebih dari 90°, jadi ini bukan segitiga siku-siku.&#x27;;
    }

    const presets = [
      { v: 60, label: &#x27;Lancip 60°&#x27; },
      { v: 90, label: &#x27;Siku-siku 90°&#x27; },
      { v: 120, label: &#x27;Tumpul 120°&#x27; }
    ].map((p) =&gt; ({
      label: p.label,
      cls: &#x27;btn press&#x27; + (th === p.v ? &#x27; on&#x27; : &#x27;&#x27;),
      pick: () =&gt; this.setAng(p.v)
    }));

    return {
      particles: particles,
      pts: Ax + &#x27;,&#x27; + Ay + &#x27; &#x27; + (Ax + L) + &#x27;,&#x27; + Ay + &#x27; &#x27; + f(Cx) + &#x27;,&#x27; + f(Cy),
      angCls: &#x27;ang&#x27; + (right ? &#x27; right&#x27; : &#x27;&#x27;),
      angD: angD,
      cX: f(Cx + 30 * cs),
      cY: f(Cy - 30 * sn + 11),
      angX: f(Ax + lr * Math.cos(half)),
      angY: f(Ay - lr * Math.sin(half) + 8),
      angText: th + &#x27;°&#x27;,
      angle: th,
      fxCls: this.fx(s.fx),
      caption: right ? &#x27;Gambar segitiga siku-siku&#x27; : (kind === &#x27;lancip&#x27; ? &#x27;Gambar segitiga lancip&#x27; : &#x27;Gambar segitiga tumpul&#x27;),
      chipCls: &#x27;verdict &#x27; + (right ? &#x27;right &#x27; + this.alt(&#x27;pop&#x27;, s.fx) : &#x27;wrong&#x27;),
      chipTitle: chipTitle,
      chipDesc: chipDesc,
      chipThm: chipThm,
      onAngle: (e) =&gt; this.setAng(e.target.value),
      presets: presets
    };
  }
}

      var out = [];
      for (var i = 0; i &lt; list.length; i++) {
        var sub = Object.create(scope);
        sub[as] = list[i];
        sub.$index = i;
        out.push(buildChildren(node, sub));
      }
      return flatten(out, []);
    }

    var props = {};
    for (var a = 0; a &lt; node.attributes.length; a++) {
      var name = node.attributes[a].name;
      var val = node.attributes[a].value;
      if (name.indexOf(&#x27;hint-&#x27;) === 0) continue;
      if (name.indexOf(&#x27;on&#x27;) === 0 &amp;&amp; name.length &gt; 2) {
        var fn = evalAttr(val, scope);
        if (typeof fn === &#x27;function&#x27;) {
          var evt = name.toLowerCase();
          if (evt === &#x27;onchange&#x27; &amp;&amp; tag === &#x27;input&#x27;) evt = &#x27;oninput&#x27;;
          props[evt] = fn;
        }
        continue;
      }
      props[name] = evalAttr(val, scope);
    }
    return h.apply(null, [tag, props].concat(buildChildren(node, scope)));
  }

  window.DCMount = function (templateEl, mountEl, ComponentClass, size) {
    var root = templateEl.content.firstElementChild;
    var comp = new ComponentClass({});
    function draw() {
      var vals = comp.renderVals();
      render(build(root, vals), mountEl);
    }
    comp.__render = draw;
    draw();

    var stage = mountEl;
    function fit() {
      var vw = window.innerWidth;
      var vh = window.innerHeight;
      var s = Math.min(vw / size.w, vh / size.h, 2);
      stage.style.width = size.w + &#x27;px&#x27;;
      stage.style.height = size.h + &#x27;px&#x27;;
      stage.style.transformOrigin = &#x27;0 0&#x27;;
      stage.style.transform = &#x27;scale(&#x27; + s + &#x27;)&#x27;;
      stage.style.left = Math.max(0, (vw - size.w * s) / 2) + &#x27;px&#x27;;
      stage.style.top = Math.max(0, (vh - size.h * s) / 2) + &#x27;px&#x27;;
    }
    window.addEventListener(&#x27;resize&#x27;, fit);
    fit();
    return comp;
  };
})();
&lt;/script&gt;
&lt;script&gt;

class Component extends DCLogic {
  D() {
    return {
      sel: &#x27;C&#x27;,
      found: { a: false, b: false, c: true },
      ans: { A: &#x27;&#x27;, B: &#x27;&#x27;, C: &#x27;&#x27; },
      shk: 0,
      fx: 0
    };
  }

  S(st) {
    return Object.assign(this.D(), st || {});
  }

  alt(prefix, n) {
    if (n === 0) return &#x27;&#x27;;
    return prefix + (n % 2 === 1 ? &#x27;A&#x27; : &#x27;B&#x27;);
  }

  fx(n) {
    if (n === 0) return &#x27;fx0&#x27;;
    return n % 2 === 1 ? &#x27;fxA&#x27; : &#x27;fxB&#x27;;
  }

  pick(v) {
    this.setState((st) =&gt; {
      const cur = this.S(st);
      const key = v.toLowerCase();
      const found = Object.assign({}, cur.found);
      found[key] = true;
      const was = cur.found.a &amp;&amp; cur.found.b &amp;&amp; cur.found.c;
      const now = found.a &amp;&amp; found.b &amp;&amp; found.c;
      const patch = { sel: v, found: found };
      if (now &amp;&amp; !was) patch.fx = cur.fx + 1;
      return patch;
    });
  }

  answer(upper) {
    this.setState((st) =&gt; {
      const cur = this.S(st);
      if (cur.ans[cur.sel] === &#x27;ok&#x27;) return null;
      const ans = Object.assign({}, cur.ans);
      if (upper) {
        ans[cur.sel] = &#x27;bad&#x27;;
        return { ans: ans, shk: cur.shk + 1 };
      }
      ans[cur.sel] = &#x27;ok&#x27;;
      return { ans: ans, fx: cur.fx + 1 };
    });
  }

  renderVals() {
    const s = this.S(this.state);
    const particles = [];
    for (let i = 0; i &lt; 12; i++) {
      particles.push({ cls: &#x27;arm r&#x27; + i + &#x27; c&#x27; + (i % 4) });
    }

    const V = {
      A: { name: &#x27;BC&#x27; },
      B: { name: &#x27;AC&#x27; },
      C: { name: &#x27;AB&#x27; }
    };
    const v = s.sel;
    const lower = v.toLowerCase();
    const name = V[v].name;
    const ans = s.ans[v];

    const edge = (k) =&gt; (lower === k ? &#x27;sel-&#x27; + k : (s.found[k] ? &#x27;fnd-&#x27; + k : &#x27;&#x27;));
    const show = (cond) =&gt; (cond ? &#x27;show&#x27; : &#x27;&#x27;);
    const vtx = (k) =&gt; (v === k ? &#x27;sel&#x27; : &#x27;&#x27;);

    const progressDefs = [
      { k: &#x27;a&#x27;, name: &#x27;BC&#x27; },
      { k: &#x27;b&#x27;, name: &#x27;AC&#x27; },
      { k: &#x27;c&#x27;, name: &#x27;AB&#x27; }
    ];
    const progress = progressDefs.map((d) =&gt; ({
      text: s.found[d.k] ? &#x27;sisi &#x27; + d.k + &#x27; = &#x27; + d.name : &#x27;sisi &#x27; + d.k + &#x27; = ?&#x27;,
      cls: &#x27;pchip&#x27; + (s.found[d.k] ? &#x27; got&#x27; : &#x27;&#x27;)
    }));

    let fbCls = &#x27;fb&#x27;;
    let fbText = &#x27;Pilih penulisan yang benar untuk nama sisi &#x27; + name + &#x27;.&#x27;;
    if (ans === &#x27;bad&#x27;) {
      fbCls = &#x27;fb bad&#x27;;
      fbText = &#x27;Huruf besar &#x27; + v + &#x27; adalah nama titik sudut. Nama sisi memakai huruf kecil.&#x27;;
    } else if (ans === &#x27;ok&#x27;) {
      fbCls = &#x27;fb ok&#x27;;
      fbText = &#x27;Tepat! Sisi &#x27; + name + &#x27; ditulis dengan huruf kecil: &#x27; + lower + &#x27;.&#x27;;
    }

    return {
      particles: particles,
      fxCls: this.fx(s.fx),

      wA: show(v === &#x27;A&#x27;),
      wB: show(v === &#x27;B&#x27;),
      wC: show(v === &#x27;C&#x27;),
      sA: show(v === &#x27;A&#x27;),
      sB: show(v === &#x27;B&#x27;),
      sC: show(v === &#x27;C&#x27;),
      eA: edge(&#x27;a&#x27;),
      eB: edge(&#x27;b&#x27;),
      eC: edge(&#x27;c&#x27;),
      lblA: show(s.found.a),
      lblB: show(s.found.b),
      lblC: show(s.found.c),

      vA: vtx(&#x27;A&#x27;),
      vB: vtx(&#x27;B&#x27;),
      vC: vtx(&#x27;C&#x27;),
      pA: v === &#x27;A&#x27;,
      pB: v === &#x27;B&#x27;,
      pC: v === &#x27;C&#x27;,
      pickA: () =&gt; this.pick(&#x27;A&#x27;),
      pickB: () =&gt; this.pick(&#x27;B&#x27;),
      pickC: () =&gt; this.pick(&#x27;C&#x27;),

      badgeCls: &#x27;badge s&#x27; + lower,
      lower: lower,
      infoTitle: &#x27;Sisi &#x27; + name + &#x27; dinamai sisi &#x27; + lower,
      infoText: &#x27;Sisi dari titik &#x27; + name.charAt(0) + &#x27; ke titik &#x27; + name.charAt(1) + &#x27; diberi nama sisi &#x27; + lower + &#x27;, karena sudut di depan sisi tersebut adalah ∠&#x27; + v + &#x27;.&#x27;,

      progress: progress,
      allFound: s.found.a &amp;&amp; s.found.b &amp;&amp; s.found.c,

      quizQ: &#x27;Penulisan nama sisi &#x27; + name + &#x27; yang benar?&#x27;,
      upLabel: v,
      loLabel: lower,
      upCls: &#x27;choice press&#x27; + (ans === &#x27;bad&#x27; ? &#x27; bad &#x27; + this.alt(&#x27;shk&#x27;, s.shk) : &#x27;&#x27;),
      loCls: &#x27;choice press&#x27; + (ans === &#x27;ok&#x27; ? &#x27; ok&#x27; : &#x27;&#x27;),
      quizOff: ans === &#x27;ok&#x27;,
      pickUpper: () =&gt; this.answer(true),
      pickLower: () =&gt; this.answer(false),
      fbCls: fbCls,
      fbText: fbText
    };
  }
}

&lt;/script&gt;

DCMount(document.getElementById(&#x27;tpl&#x27;), document.getElementById(&#x27;stage&#x27;), Component, { w: 1000, h: 740 });

      var cond = evalAttr(node.getAttribute(&#x27;value&#x27;) || &#x27;&#x27;, scope);
      return cond ? buildChildren(node, scope) : null;
    }
    if (tag === &#x27;sc-for&#x27;) {
      var list = evalAttr(node.getAttribute(&#x27;list&#x27;) || &#x27;&#x27;, scope) || [];
      var as = node.getAttribute(&#x27;as&#x27;) || &#x27;item&#x27;;
      var out = [];
      for (var i = 0; i &lt; list.length; i++) {
        var sub = Object.create(scope);
        sub[as] = list[i];
        sub.$index = i;
        out.push(buildChildren(node, sub));
      }
      return flatten(out, []);
    }

    var props = {};
    for (var a = 0; a &lt; node.attributes.length; a++) {
      var name = node.attributes[a].name;
      var val = node.attributes[a].value;
      if (name.indexOf(&#x27;hint-&#x27;) === 0) continue;
      if (name.indexOf(&#x27;on&#x27;) === 0 &amp;&amp; name.length &gt; 2) {
        var fn = evalAttr(val, scope);
        if (typeof fn === &#x27;function&#x27;) {
          var evt = name.toLowerCase();
          if (evt === &#x27;onchange&#x27; &amp;&amp; tag === &#x27;input&#x27;) evt = &#x27;oninput&#x27;;
          props[evt] = fn;
        }
        continue;
      }
      props[name] = evalAttr(val, scope);
    }
    return h.apply(null, [tag, props].concat(buildChildren(node, scope)));
  }

  window.DCMount = function (templateEl, mountEl, ComponentClass, size) {
    var root = templateEl.content.firstElementChild;
    var comp = new ComponentClass({});

      stage.style.height = size.h + &#x27;px&#x27;;

&lt;script&gt;

class Component extends DCLogic {
  D() {
    return { mode: &#x27;hyp&#x27;, a: 3, b: 4, fx: 0 };
  }

  S(st) {
    return Object.assign(this.D(), st || {});
  }

  alt(prefix, n) {
    if (n === 0) return &#x27;&#x27;;
    return prefix + (n % 2 === 1 ? &#x27;A&#x27; : &#x27;B&#x27;);
  }

  setMode(m) {
    this.setState((st) =&gt; {
      const cur = this.S(st);
      if (cur.mode === m) return null;
      return { mode: m, fx: cur.fx + 1 };
    });
  }

  setLen(key, raw) {
    let v = Math.round(Number(raw));
    if (isNaN(v)) return;
    v = Math.max(2, Math.min(9, v));
    const patch = {};
    patch[key] = v;
    this.setState(patch);
  }

  renderVals() {
    const s = this.S(this.state);
    const f = (n) =&gt; n.toFixed(1);
    const dec = (x) =&gt; {
      const r = Math.round(x * 100) / 100;
      return Number.isInteger(r) ? String(r) : r.toFixed(2).replace(&#x27;.&#x27;, &#x27;,&#x27;);
    };

    const a = s.a;
    const b = s.b;
    const u = Math.min(64, 300 / Math.max(a, b));
    const Ax = (500 - b * u) / 2 - 8;
    const Ay = 215 + a * u / 2;
    const Cx = Ax + b * u;
    const By = Ay - a * u;
    const c = Math.sqrt(a * a + b * b);
    const mx = (Ax + Cx) / 2;
    const my = (Ay + By) / 2;
    const nx = -a / c;
    const ny = -b / c;
    const hyp = s.mode === &#x27;hyp&#x27;;

    const modes = [
      { k: &#x27;hyp&#x27;, label: &#x27;Sisi miring (c)&#x27; },
      { k: &#x27;legs&#x27;, label: &#x27;Sisi tegak (a dan b)&#x27; }
    ].map((d) =&gt; ({
      label: d.label,
      pressed: s.mode === d.k,
      cls: &#x27;btn press&#x27; + (s.mode === d.k ? &#x27; on&#x27; : &#x27;&#x27;),
      pick: () =&gt; this.setMode(d.k)
    }));

    return {
      pts: f(Ax) + &#x27;,&#x27; + f(Ay) + &#x27; &#x27; + f(Cx) + &#x27;,&#x27; + f(Ay) + &#x27; &#x27; + f(Cx) + &#x27;,&#x27; + f(By),
      aX: Ax,
      aY: Ay,
      cX: f(Cx),
      bY: f(By),
      pX: f(Cx - 12),
      pY: f(Ay - 12),
      mX: f(mx),
      mY: f(my),
      sightCls: hyp ? &#x27;show&#x27; : &#x27;&#x27;,
      eA: hyp ? &#x27;&#x27; : &#x27;sel-a&#x27;,
      eB: hyp ? &#x27;&#x27; : &#x27;sel-b&#x27;,
      eC: hyp ? &#x27;sel-c&#x27; : &#x27;&#x27;,
      angCls: hyp ? &#x27;&#x27; : &#x27;hot&#x27;,
      rmPts: f(Cx - 24) + &#x27;,&#x27; + f(Ay) + &#x27; &#x27; + f(Cx - 24) + &#x27;,&#x27; + f(Ay - 24) + &#x27; &#x27; + f(Cx) + &#x27;,&#x27; + f(Ay - 24) + &#x27; &#x27; + f(Cx) + &#x27;,&#x27; + f(Ay),
      pingCls: this.alt(&#x27;ping&#x27;, s.fx),

      vAX: f(Ax - 26),
      vAY: f(Ay + 30),
      vBX: f(Cx + 26),
      vBY: f(By - 4),
      vCX: f(Cx + 26),
      vCY: f(Ay + 30),
      lAX: f(Cx + 28),
      lAY: f((By + Ay) / 2 + 12),
      lBX: f(mx),
      lBY: f(Ay + 40),
      lCX: f(mx + 30 * nx),
      lCY: f(my + 30 * ny + 12),

      modes: modes,
      infoPop: this.alt(&#x27;pop&#x27;, s.fx),
      infoTitle: hyp ? &#x27;Sisi c adalah sisi miring (hipotenusa)&#x27; : &#x27;Sisi a dan b adalah sisi tegak&#x27;,
      infoText: hyp
        ? &#x27;Sisi c selalu berhadapan dengan sudut siku-siku, dan menjadi sisi yang paling panjang.&#x27;
        : &#x27;Sisi a dan b disebut sisi tegak karena keduanya bertemu di titik C dan membentuk sudut siku-siku.&#x27;,

      aVal: a,
      bVal: b,
      onA: (e) =&gt; this.setLen(&#x27;a&#x27;, e.target.value),
      onB: (e) =&gt; this.setLen(&#x27;b&#x27;, e.target.value),

      wA: a * 19,
      wB: b * 19,
      wC: f(c * 19),
      xA: f(38 + a * 19),
      xB: f(38 + b * 19),
      xC: f(38 + c * 19),
      barADim: hyp ? &#x27;dim&#x27; : &#x27;&#x27;,
      barBDim: hyp ? &#x27;dim&#x27; : &#x27;&#x27;,
      barCDim: hyp ? &#x27;&#x27; : &#x27;dim&#x27;,
      tA: String(a),
      tB: String(b),
      tC: dec(c),
      statement: &#x27;c = &#x27; + dec(c) + &#x27; lebih panjang daripada a = &#x27; + a + &#x27; dan b = &#x27; + b + &#x27;. Ubah panjang a dan b: sisi miring tetap yang paling panjang.&#x27;
    };
  }
}

&lt;/script&gt;

    }
    if (tag === &#x27;sc-for&#x27;) {
      var list = evalAttr(node.getAttribute(&#x27;list&#x27;) || &#x27;&#x27;, scope) || [];
      var as = node.getAttribute(&#x27;as&#x27;) || &#x27;item&#x27;;
      var out = [];
      for (var i = 0; i &lt; list.length; i++) {
        var sub = Object.create(scope);
        sub[as] = list[i];
        sub.$index = i;
        out.push(buildChildren(node, sub));
      }
      return flatten(out, []);
    }

    var props = {};
    for (var a = 0; a &lt; node.attributes.length; a++) {
      var name = node.attributes[a].name;
      var val = node.attributes[a].value;
      if (name.indexOf(&#x27;hint-&#x27;) === 0) continue;
      if (name.indexOf(&#x27;on&#x27;) === 0 &amp;&amp; name.length &gt; 2) {
        var fn = evalAttr(val, scope);
        if (typeof fn === &#x27;function&#x27;) {
          var evt = name.toLowerCase();
          if (evt === &#x27;onchange&#x27; &amp;&amp; tag === &#x27;input&#x27;) evt = &#x27;oninput&#x27;;
          props[evt] = fn;
        }
        continue;
      }
      props[name] = evalAttr(val, scope);
    }
    return h.apply(null, [tag, props].concat(buildChildren(node, scope)));
  }

  window.DCMount = function (templateEl, mountEl, ComponentClass, size) {
    var root = templateEl.content.firstElementChild;
    var comp = new ComponentClass({});
    function draw() {
      var vals = comp.renderVals();
      render(build(root, vals), mountEl);
    }
    comp.__render = draw;
    draw();

    var stage = mountEl;
    function fit() {
      var vw = window.innerWidth;
      var vh = window.innerHeight;
      var s = Math.min(vw / size.w, vh / size.h, 2);
      stage.style.width = size.w + &#x27;px&#x27;;
      stage.style.height = size.h + &#x27;px&#x27;;
      stage.style.transformOrigin = &#x27;0 0&#x27;;
      stage.style.transform = &#x27;scale(&#x27; + s + &#x27;)&#x27;;
      stage.style.left = Math.max(0, (vw - size.w * s) / 2) + &#x27;px&#x27;;
      stage.style.top = Math.max(0, (vh - size.h * s) / 2) + &#x27;px&#x27;;
    }
    window.addEventListener(&#x27;resize&#x27;, fit);
    fit();
    return comp;
  };
})();
&lt;/script&gt;
&lt;script&gt;

class Component extends DCLogic {
  D() {
    return { unk: &#x27;c&#x27;, vals: { a: 3, b: 4, c: 5 }, shown: false, fx: 0 };
  }

  S(st) {
    return Object.assign(this.D(), st || {});
  }

  fx(n) {
    if (n === 0) return &#x27;fx0&#x27;;
    return n % 2 === 1 ? &#x27;fxA&#x27; : &#x27;fxB&#x27;;
  }

  legOf(unk) {
    return unk === &#x27;a&#x27; ? &#x27;b&#x27; : &#x27;a&#x27;;
  }

  fix(unk, vals) {
    const v = Object.assign({}, vals);
    if (unk !== &#x27;c&#x27;) {
      const leg = this.legOf(unk);
      if (v.c &lt;= v[leg]) v.c = v[leg] + 1;
    }
    return v;
  }

  setUnk(k) {
    this.setState((st) =&gt; {
      const cur = this.S(st);
      if (cur.unk === k) return null;
      return { unk: k, vals: this.fix(k, cur.vals), shown: false };
    });
  }

  adj(key, d) {
    this.setState((st) =&gt; {
      const cur = this.S(st);
      const v = Object.assign({}, cur.vals);
      const max = key === &#x27;c&#x27; ? 15 : 12;
      v[key] = Math.max(1, Math.min(max, v[key] + d));
      return { vals: this.fix(cur.unk, v), shown: false };
    });
  }

  calc() {
    this.setState((st) =&gt; {
      const cur = this.S(st);
      return { shown: true, fx: cur.fx + 1 };
    });
  }

  renderVals() {
    const s = this.S(this.state);
    const particles = [];
    for (let i = 0; i &lt; 12; i++) {
      particles.push({ cls: &#x27;arm r&#x27; + i + &#x27; c&#x27; + (i % 4) });
    }
    const f = (n) =&gt; n.toFixed(1);
    const dec = (x) =&gt; (Math.round(x * 100) / 100).toFixed(2).replace(&#x27;.&#x27;, &#x27;,&#x27;);
    const perfect = (n) =&gt; {
      const r = Math.round(Math.sqrt(n));
      return r * r === n;
    };

    const unk = s.unk;
    const v = s.vals;
    let a2 = v.a * v.a;
    let b2 = v.b * v.b;
    let c2 = v.c * v.c;
    if (unk === &#x27;c&#x27;) c2 = a2 + b2;
    else if (unk === &#x27;b&#x27;) b2 = c2 - a2;
    else a2 = c2 - b2;
    const A = Math.sqrt(a2);
    const B = Math.sqrt(b2);
    const C = Math.sqrt(c2);

    // ---- gambar ----
    const u = Math.min(40, 452 / (2 * A + B), 372 / (A + 2 * B));
    const W = (2 * A + B) * u;
    const H = (A + 2 * B) * u;
    const au = A * u;
    const bu = B * u;
    const ox = (500 - W) / 2 + au;
    const oy = (420 - H) / 2 + (A + B) * u;
    const P = (x, y) =&gt; f(x) + &#x27;,&#x27; + f(y);
    const rmS = Math.min(16, 0.5 * Math.min(au, bu));

    const label = (k, n2) =&gt; {
      if (k === unk &amp;&amp; !s.shown) return k + &#x27;² = ?&#x27;;
      return k + &#x27;² = &#x27; + n2;
    };

    // ---- rumus ----
    const fDefs = [
      { k: &#x27;c&#x27;, text: &#x27;c = √(a² + b²)&#x27; },
      { k: &#x27;b&#x27;, text: &#x27;b = √(c² − a²)&#x27; },
      { k: &#x27;a&#x27;, text: &#x27;a = √(c² − b²)&#x27; }
    ];
    const formulas = fDefs.map((d) =&gt; ({
      text: d.text,
      pressed: unk === d.k,
      cls: &#x27;frm press&#x27; + (unk === d.k ? &#x27; on&#x27; : &#x27;&#x27;),
      pick: () =&gt; this.setUnk(d.k)
    }));

    // ---- nilai yang diketahui ----
    const keys = unk === &#x27;c&#x27; ? [&#x27;a&#x27;, &#x27;b&#x27;] : (unk === &#x27;b&#x27; ? [&#x27;a&#x27;, &#x27;c&#x27;] : [&#x27;b&#x27;, &#x27;c&#x27;]);
    const leg = this.legOf(unk);
    const knowns = keys.map((k) =&gt; {
      const max = k === &#x27;c&#x27; ? 15 : 12;
      const minC = unk !== &#x27;c&#x27; &amp;&amp; k === &#x27;c&#x27; ? v[leg] + 1 : 1;
      return {
        label: k,
        val: v[k],
        decLabel: &#x27;Kurangi &#x27; + k,
        incLabel: &#x27;Tambah &#x27; + k,
        decDis: v[k] &lt;= minC,
        incDis: v[k] &gt;= max,
        dec: () =&gt; this.adj(k, -1),
        inc: () =&gt; this.adj(k, 1)
      };
    });

    // ---- langkah hitung ----
    const unkN2 = unk === &#x27;c&#x27; ? c2 : (unk === &#x27;b&#x27; ? b2 : a2);
    const rootR = Math.round(Math.sqrt(unkN2));
    const res = perfect(unkN2) ? String(rootR) : &#x27;√&#x27; + unkN2 + &#x27; ≈ &#x27; + dec(Math.sqrt(unkN2));
    let l1;
    let l2;
    if (unk === &#x27;c&#x27;) {
      l1 = &#x27;c = √(&#x27; + v.a + &#x27;² + &#x27; + v.b + &#x27;²)&#x27;;
      l2 = &#x27;c = √(&#x27; + a2 + &#x27; + &#x27; + b2 + &#x27;) = √&#x27; + c2;
    } else if (unk === &#x27;b&#x27;) {
      l1 = &#x27;b = √(&#x27; + v.c + &#x27;² − &#x27; + v.a + &#x27;²)&#x27;;
      l2 = &#x27;b = √(&#x27; + c2 + &#x27; − &#x27; + a2 + &#x27;) = √&#x27; + b2;
    } else {
      l1 = &#x27;a = √(&#x27; + v.c + &#x27;² − &#x27; + v.b + &#x27;²)&#x27;;
      l2 = &#x27;a = √(&#x27; + c2 + &#x27; − &#x27; + b2 + &#x27;) = √&#x27; + a2;
    }
    const lines = [l1, l2, unk + &#x27; = &#x27; + res].map((t, i) =&gt; ({ t: t, cls: &#x27;fadeUp d&#x27; + (i + 1) }));
    const triple = perfect(a2) &amp;&amp; perfect(b2) &amp;&amp; perfect(c2);
    const wA = 300 * a2 / c2;
    const wB = 300 - wA;

    return {
      particles: particles,
      fxCls: this.fx(s.fx),

      sqA: P(ox, oy) + &#x27; &#x27; + P(ox, oy - au) + &#x27; &#x27; + P(ox - au, oy - au) + &#x27; &#x27; + P(ox - au, oy),
      sqB: P(ox, oy) + &#x27; &#x27; + P(ox + bu, oy) + &#x27; &#x27; + P(ox + bu, oy + bu) + &#x27; &#x27; + P(ox, oy + bu),
      sqC: P(ox, oy - au) + &#x27; &#x27; + P(ox + bu, oy) + &#x27; &#x27; + P(ox + bu + au, oy - bu) + &#x27; &#x27; + P(ox + au, oy - au - bu),
      tri: P(ox, oy) + &#x27; &#x27; + P(ox, oy - au) + &#x27; &#x27; + P(ox + bu, oy),
      rm: P(ox + rmS, oy) + &#x27; &#x27; + P(ox + rmS, oy - rmS) + &#x27; &#x27; + P(ox, oy - rmS),
      tA: label(&#x27;a&#x27;, a2),
      tB: label(&#x27;b&#x27;, b2),
      tC: label(&#x27;c&#x27;, c2),
      tAX: f(ox - au / 2),
      tAY: f(oy - au / 2 + 5),
      tBX: f(ox + bu / 2),
      tBY: f(oy + bu / 2 + 5),
      tCX: f(ox + (au + bu) / 2),
      tCY: f(oy - (au + bu) / 2 + 5),
      showA: au &gt;= 64 ? &#x27;show&#x27; : &#x27;&#x27;,
      showB: bu &gt;= 64 ? &#x27;show&#x27; : &#x27;&#x27;,
      showC: C * u &gt;= 64 ? &#x27;show&#x27; : &#x27;&#x27;,

      formulas: formulas,
      knowns: knowns,
      calc: () =&gt; this.calc(),
      calcLabel: &#x27;Hitung sisi &#x27; + unk,

      shown: s.shown,
      hidden: !s.shown,
      lines: lines,
      isTriple: triple,
      tripleText: &#x27;Triple Pythagoras: (&#x27; + (unk === &#x27;a&#x27; ? rootR : v.a) + &#x27;, &#x27; + (unk === &#x27;b&#x27; ? rootR : v.b) + &#x27;, &#x27; + (unk === &#x27;c&#x27; ? rootR : v.c) + &#x27;), semuanya bulat.&#x27;,

      barsCls: s.shown ? &#x27;show&#x27; : &#x27;&#x27;,
      wA: f(wA),
      wB: f(wB),
      eC: String(c2),
      eA: wA &gt;= 40 ? String(a2) : &#x27;&#x27;,
      eB: wB &gt;= 40 ? String(b2) : &#x27;&#x27;,
      eAX: f(wA / 2),
      eBX: f(wA + wB / 2)
    };
  }
}

&lt;/script&gt;
&lt;script&gt;
DCMount(document.getElementById(&#x27;tpl&#x27;), document.getElementById(&#x27;stage&#x27;), Component, { w: 1000, h: 740 });
&lt;/script&gt;
