/* efek ledakan titik warna */
.burst { position: absolute; width: 0; height: 0; pointer-events: none; }
.arm { position: absolute; left: 0; top: 0; width: 0; height: 0; }
.dot { position: absolute; left: -5px; top: -5px; width: 10px; height: 10px; border-radius: 50%; opacity: 0; }
.arm:nth-child(even) .dot { width: 7px; height: 7px; left: -3.5px; top: -3.5px; }
.r0 { transform: rotate(0deg); }
.r1 { transform: rotate(30deg); }
.r2 { transform: rotate(60deg); }
.r3 { transform: rotate(90deg); }
.r4 { transform: rotate(120deg); }
.r5 { transform: rotate(150deg); }
.r6 { transform: rotate(180deg); }
.r7 { transform: rotate(210deg); }
.r8 { transform: rotate(240deg); }
.r9 { transform: rotate(270deg); }
.r10 { transform: rotate(300deg); }
.r11 { transform: rotate(330deg); }
.c0 .dot { background: #F2B01E; }
.c1 .dot { background: #2F5D3A; }
.c2 .dot { background: #B8520A; }
.c3 .dot { background: #2A63A8; }
.fxA .dot { animation: outA .85s ease-out both; }
.fxB .dot { animation: outB .85s ease-out both; }
@keyframes outA {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-110px) scale(.3); }
}
@keyframes outB {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-110px) scale(.3); }
}
.riseA { animation: riseA .4s ease both; }
.riseB { animation: riseB .4s ease both; }
@keyframes riseA {
  0% { opacity: 0; transform: translateY(6px); }
  100% { opacity: 1; transform: none; }
}
@keyframes riseB {
  0% { opacity: 0; transform: translateY(6px); }
  100% { opacity: 1; transform: none; }
}
.d1 { animation-delay: .02s; }
.d2 { animation-delay: .12s; }
.d3 { animation-delay: .22s; }
.d4 { animation-delay: .32s; }
.popA { animation: popA .45s cubic-bezier(.2, 1.5, .4, 1); }
.popB { animation: popB .45s cubic-bezier(.2, 1.5, .4, 1); }
@keyframes popA {
  0% { transform: scale(.95); }
  60% { transform: scale(1.03); }
  100% { transform: scale(1); }
}
@keyframes popB {
  0% { transform: scale(.95); }
  60% { transform: scale(1.03); }
  100% { transform: scale(1); }
}

      for (var i = 0; i &lt; list.length; i++) {
        var sub = Object.create(scope);
        sub[as] = list[i];
        sub.$index = i;
        out.push(buildChildren(node, sub));
      }
      return flatten(out, []);
    }

    var props = {};
    for (var a = 0; a &lt; node.attributes.length; a++) {
      var name = node.attributes[a].name;
      var val = node.attributes[a].value;
      if (name.indexOf(&#x27;hint-&#x27;) === 0) continue;
      if (name.indexOf(&#x27;on&#x27;) === 0 &amp;&amp; name.length &gt; 2) {
        var fn = evalAttr(val, scope);
        if (typeof fn === &#x27;function&#x27;) {
          var evt = name.toLowerCase();
          if (evt === &#x27;onchange&#x27; &amp;&amp; tag === &#x27;input&#x27;) evt = &#x27;oninput&#x27;;
          props[evt] = fn;
        }
        continue;
      }
      props[name] = evalAttr(val, scope);
    }
    return h.apply(null, [tag, props].concat(buildChildren(node, scope)));
  }

  window.DCMount = function (templateEl, mountEl, ComponentClass, size) {
    var root = templateEl.content.firstElementChild;
    var comp = new ComponentClass({});
    function draw() {
      var vals = comp.renderVals();
      render(build(root, vals), mountEl);
    }
    comp.__render = draw;
    draw();

    var stage = mountEl;
    function fit() {
      var vw = window.innerWidth;
      var vh = window.innerHeight;
      var s = Math.min(vw / size.w, vh / size.h, 2);
      stage.style.width = size.w + &#x27;px&#x27;;
      stage.style.height = size.h + &#x27;px&#x27;;
      stage.style.transformOrigin = &#x27;0 0&#x27;;
      stage.style.transform = &#x27;scale(&#x27; + s + &#x27;)&#x27;;
      stage.style.left = Math.max(0, (vw - size.w * s) / 2) + &#x27;px&#x27;;
      stage.style.top = Math.max(0, (vh - size.h * s) / 2) + &#x27;px&#x27;;
    }
    window.addEventListener(&#x27;resize&#x27;, fit);
    fit();
    return comp;

&lt;/script&gt;
&lt;script&gt;

class Component extends DCLogic {
  S(st) {
    return Object.assign(this.D(), st || {});
  }

  fx(n) {
    if (n === 0) return &#x27;fx0&#x27;;
    return n % 2 === 1 ? &#x27;fxA&#x27; : &#x27;fxB&#x27;;
  }

  alt(prefix, n) {
    if (n === 0) return &#x27;&#x27;;
    return prefix + (n % 2 === 1 ? &#x27;A&#x27; : &#x27;B&#x27;);
  }

  burstParticles() {
    const particles = [];
    for (let i = 0; i &lt; 12; i++) {
      particles.push({ cls: &#x27;arm r&#x27; + i + &#x27; c&#x27; + (i % 4) });
    }
    return particles;
  }

  D() {
    return { v: { a: 3, b: 4, c: 5 }, fx: 0 };
  }

  isRight(v) {
    return v.a * v.a + v.b * v.b === v.c * v.c;
  }

  step(v0, key, d) {
    const v = Object.assign({}, v0);
    v[key] += d;
    if (key === &#x27;a&#x27;) {
      if (v.b &lt;= v.a) v.b = v.a + 1;
      if (v.c &lt;= v.b) v.c = v.b + 1;
    } else if (key === &#x27;b&#x27;) {
      if (v.a &gt;= v.b) v.a = v.b - 1;
      if (v.c &lt;= v.b) v.c = v.b + 1;
    } else {
      if (v.b &gt;= v.c) v.b = v.c - 1;
      if (v.a &gt;= v.b) v.a = v.b - 1;
    }
    if (v.a &lt; 1 || v.c &gt; 20) return null;
    return v;
  }

  setV(nv) {
    this.setState((st) =&gt; {
      const cur = this.S(st);
      const patch = { v: nv };
      if (this.isRight(nv) &amp;&amp; !this.isRight(cur.v)) patch.fx = cur.fx + 1;
      return patch;
    });
  }

  renderVals() {
    const s = this.S(this.state);
    const v = s.v;
    const a = v.a;
    const b = v.b;
    const c = v.c;
    const f = (n) =&gt; n.toFixed(1);
    const pt = (P) =&gt; f(P[0]) + &#x27; &#x27; + f(P[1]);
    const a2 = a * a;
    const b2 = b * b;
    const c2 = c * c;
    const sum = a2 + b2;
    const kind = sum === c2 ? &#x27;siku&#x27; : (sum &gt; c2 ? &#x27;lancip&#x27; : &#x27;tumpul&#x27;);
    const valid = a + b &gt; c;

    const xC = (b2 + c2 - a2) / (2 * c);
    const h = Math.sqrt(Math.max(0.0001, b2 - xC * xC));
    const u = valid ? Math.min(300 / c, 280 / h, 56) : 1;
    const x0 = (500 - c * u) / 2;
    const y0 = 220 + h * u / 2;
    const A = [x0, y0];
    const B = [x0 + c * u, y0];
    const C = [x0 + xC * u, y0 - h * u];
    const G = [(A[0] + B[0] + C[0]) / 3, (A[1] + B[1] + C[1]) / 3];
    const unit = (P, Q) =&gt; {
      const dx = Q[0] - P[0];
      const dy = Q[1] - P[1];
      const L = Math.hypot(dx, dy);
      return [dx / L, dy / L];
    };
    const uA = unit(C, A);
    const uB = unit(C, B);
    const cosC = (a2 + b2 - c2) / (2 * a * b);
    const deg = Math.round(Math.acos(Math.max(-1, Math.min(1, cosC))) * 180 / Math.PI);
    const right = kind === &#x27;siku&#x27;;
    const r = right ? 26 : 36;
    const p1 = [C[0] + r * uA[0], C[1] + r * uA[1]];
    const p2 = [C[0] + r * uB[0], C[1] + r * uB[1]];
    let angD;
    if (right) {
      const q = [C[0] + r * (uA[0] + uB[0]), C[1] + r * (uA[1] + uB[1])];
      angD = &#x27;M &#x27; + pt(C) + &#x27; L &#x27; + pt(p1) + &#x27; L &#x27; + pt(q) + &#x27; L &#x27; + pt(p2) + &#x27; Z&#x27;;
    } else {
      const cross = uA[0] * uB[1] - uA[1] * uB[0];
      angD = &#x27;M &#x27; + pt(C) + &#x27; L &#x27; + pt(p1) + &#x27; A &#x27; + r + &#x27; &#x27; + r + &#x27; 0 0 &#x27; + (cross &gt; 0 ? 1 : 0) + &#x27; &#x27; + pt(p2) + &#x27; Z&#x27;;
    }
    let bx = uA[0] + uB[0];
    let by = uA[1] + uB[1];
    const bl = Math.hypot(bx, by) || 1;
    bx /= bl;
    by /= bl;
    const dist = right ? 58 : 68;

    const sideLab = (P, Q, t, d, anc) =&gt; {
      const mx = (P[0] + Q[0]) / 2;
      const my = (P[1] + Q[1]) / 2;
      let nx = -(Q[1] - P[1]);
      let ny = Q[0] - P[0];
      const L = Math.hypot(nx, ny) || 1;
      nx /= L;
      ny /= L;
      if ((mx - G[0]) * nx + (my - G[1]) * ny &lt; 0) {
        nx = -nx;
        ny = -ny;
      }
      const cx = mx + nx * d;
      const cy = my + ny * d;
      const w = 28 + 13 * t.length;
      return { x: f(cx), y: f(cy + 8), t: t, anc: anc, rx: f(cx - w / 2), ry: f(cy - 18), rw: f(w) };
    };

    const fills = { siku: &#x27;#DDEBCF&#x27;, lancip: &#x27;#FDEBC8&#x27;, tumpul: &#x27;#F9D9D0&#x27; };
    const names = { siku: &#x27;siku-siku&#x27;, lancip: &#x27;lancip&#x27;, tumpul: &#x27;tumpul&#x27; };

    let vTitle = &#x27;a² + b² = c²&#x27;;
    let l3 = &#x27;Sama besar, sudut C = 90°: siku-siku.&#x27;;
    let vcls = &#x27;verdict right &#x27; + this.alt(&#x27;pop&#x27;, s.fx);
    if (kind === &#x27;lancip&#x27;) {
      vTitle = &#x27;a² + b² &gt; c²&#x27;;
      l3 = &#x27;c² lebih kecil, sudut C menyempit: segitiga lancip.&#x27;;
      vcls = &#x27;verdict wrong&#x27;;
    } else if (kind === &#x27;tumpul&#x27;) {
      vTitle = &#x27;a² + b² &lt; c²&#x27;;
      l3 = &#x27;c² lebih besar, sudut C melebar lewat 90°: segitiga tumpul.&#x27;;
      vcls = &#x27;verdict wrong&#x27;;
    }
    if (!valid) {
      l3 = &#x27;Karena a + b tidak lebih dari c, ketiganya tidak membentuk segitiga.&#x27;;
      vcls = &#x27;verdict wrong&#x27;;
    }

    const defs = [
      { k: &#x27;a&#x27;, note: &#x27;sisi terpendek&#x27; },
      { k: &#x27;b&#x27;, note: &#x27;sisi tengah&#x27; },
      { k: &#x27;c&#x27;, note: &#x27;sisi terpanjang&#x27; }
    ];
    const knowns = defs.map((d) =&gt; {
      const dn = this.step(v, d.k, -1);
      const up = this.step(v, d.k, 1);
      return {
        label: d.k,
        note: d.note,
        val: v[d.k],
        decLabel: &#x27;Kurangi &#x27; + d.k,
        incLabel: &#x27;Tambah &#x27; + d.k,
        decDis: dn === null,
        incDis: up === null,
        dec: () =&gt; { const n = this.step(this.S(this.state).v, d.k, -1); if (n) this.setV(n); },
        inc: () =&gt; { const n = this.step(this.S(this.state).v, d.k, 1); if (n) this.setV(n); }
      };
    });

    const presets = [
      { v: { a: 3, b: 4, c: 5 }, label: &#x27;Siku-siku\n(3, 4, 5)&#x27; },
      { v: { a: 4, b: 5, c: 6 }, label: &#x27;Lancip\n(4, 5, 6)&#x27; },
      { v: { a: 2, b: 3, c: 4 }, label: &#x27;Tumpul\n(2, 3, 4)&#x27; }
    ].map((p) =&gt; ({
      label: p.label,
      cls: &#x27;btn press&#x27; + (p.v.a === a &amp;&amp; p.v.b === b &amp;&amp; p.v.c === c ? &#x27; on&#x27; : &#x27;&#x27;),
      pick: () =&gt; this.setV(p.v)
    }));

    return {
      particles: this.burstParticles(),
      fxCls: this.fx(s.fx),
      triG: valid ? &#x27;&#x27; : &#x27;off&#x27;,
      msgCls: valid ? &#x27;off&#x27; : &#x27;&#x27;,
      pts: pt(A) + &#x27; &#x27; + pt(B) + &#x27; &#x27; + pt(C),
      triFill: fills[kind],
      angCls: &#x27;ang&#x27; + (right ? &#x27; right&#x27; : &#x27;&#x27;),
      angD: angD,
      vA: { x: f(A[0] - 16), y: f(A[1] + 30) },
      vB: { x: f(B[0] + 16), y: f(B[1] + 30) },
      vC: { x: f(C[0] - bx * 30), y: f(C[1] - by * 30 + 11) },
      sA: { x1: f(B[0]), y1: f(B[1]), x2: f(C[0]), y2: f(C[1]) },
      sB: { x1: f(A[0]), y1: f(A[1]), x2: f(C[0]), y2: f(C[1]) },
      sC: { x1: f(A[0]), y1: f(A[1]), x2: f(B[0]), y2: f(B[1]) },
      la: sideLab(B, C, &#x27;a = &#x27; + a, 40, &#x27;middle&#x27;),
      lb: sideLab(A, C, &#x27;b = &#x27; + b, 40, &#x27;middle&#x27;),
      lc: sideLab(A, B, &#x27;c = &#x27; + c, 36, &#x27;middle&#x27;),
      angX: f(C[0] + bx * (dist + 4)),
      angY: f(C[1] + by * (dist + 4) + 8),
      angText: deg + &#x27;°&#x27;,
      caption: valid ? &#x27;Segitiga &#x27; + names[kind] + &#x27; dengan sisi &#x27; + a + &#x27;, &#x27; + b + &#x27;, &#x27; + c : &#x27;Belum bisa dibentuk menjadi segitiga&#x27;,
      knowns: knowns,
      presets: presets,
      verdictCls: vcls,
      vTitle: vTitle,
      l1: &#x27;a² + b² = &#x27; + a + &#x27;² + &#x27; + b + &#x27;² = &#x27; + sum,
      l2: &#x27;c² = &#x27; + c + &#x27;² = &#x27; + c2,
      l3: l3,
      isTriple: kind === &#x27;siku&#x27;,
      tripleText: &#x27;Triple Pythagoras: (&#x27; + a + &#x27;, &#x27; + b + &#x27;, &#x27; + c + &#x27;)&#x27;
    };
  }
}

&lt;/script&gt;

  burstParticles() {

    const k = s.k;

    const C = c * k;
    const f = (n) =&gt; n.toFixed(1);
    const P = (x, y) =&gt; f(x) + &#x27;,&#x27; + f(y);

.fxB .dot { animation: outB .85s ease-out both; }
@keyframes outA {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-110px) scale(.3); }
}
@keyframes outB {
  0% { opacity: 1; transform: translateY(0) scale(1); }
  100% { opacity: 0; transform: translateY(-110px) scale(.3); }
}
.riseA { animation: riseA .4s ease both; }
.riseB { animation: riseB .4s ease both; }
@keyframes riseA {
  0% { opacity: 0; transform: translateY(6px); }
  100% { opacity: 1; transform: none; }
}
@keyframes riseB {
  0% { opacity: 0; transform: translateY(6px); }
  100% { opacity: 1; transform: none; }
}
.d1 { animation-delay: .02s; }
.d2 { animation-delay: .12s; }
.d3 { animation-delay: .22s; }
.d4 { animation-delay: .32s; }
.popA { animation: popA .45s cubic-bezier(.2, 1.5, .4, 1); }
.popB { animation: popB .45s cubic-bezier(.2, 1.5, .4, 1); }
@keyframes popA {
  0% { transform: scale(.95); }
  60% { transform: scale(1.03); }
  100% { transform: scale(1); }
}
@keyframes popB {
  0% { transform: scale(.95); }
  60% { transform: scale(1.03); }
  100% { transform: scale(1); }
}

.ang { fill: rgba(226, 169, 74, .4); stroke: #8A4B0F; transition: fill .25s ease, stroke .25s ease; }
.ang.right { fill: rgba(47, 93, 58, .32); stroke: #2F5D3A; }
.verdict { border-radius: 16px; padding: 10px 16px; border: 2px solid #D9C48F; background: #FFFFFF; display: flex; flex-direction: column; gap: 4px; }
.verdict.right { background: #DDEBCF; border-color: #2F5D3A; }
.verdict.wrong { background: #FFF1DA; border-color: #E2A94A; }
.cA { color: #1D4780; }
.cB { color: #145A3B; }
.cC { color: #8F3B04; }

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
}

      for (var i = 0; i &lt; list.length; i++) {
        var sub = Object.create(scope);
        sub[as] = list[i];
        sub.$index = i;
        out.push(buildChildren(node, sub));
      }
      return flatten(out, []);
    }

    var props = {};
    for (var a = 0; a &lt; node.attributes.length; a++) {
      var name = node.attributes[a].name;
      var val = node.attributes[a].value;
      if (name.indexOf(&#x27;hint-&#x27;) === 0) continue;
      if (name.indexOf(&#x27;on&#x27;) === 0 &amp;&amp; name.length &gt; 2) {
        var fn = evalAttr(val, scope);
        if (typeof fn === &#x27;function&#x27;) {
          var evt = name.toLowerCase();
          if (evt === &#x27;onchange&#x27; &amp;&amp; tag === &#x27;input&#x27;) evt = &#x27;oninput&#x27;;
          props[evt] = fn;
        }
        continue;
      }
      props[name] = evalAttr(val, scope);
    }
    return h.apply(null, [tag, props].concat(buildChildren(node, scope)));
  }

  window.DCMount = function (templateEl, mountEl, ComponentClass, size) {
    var root = templateEl.content.firstElementChild;
    var comp = new ComponentClass({});
    function draw() {
      var vals = comp.renderVals();
      render(build(root, vals), mountEl);
    }
    comp.__render = draw;
    draw();

    var stage = mountEl;
    function fit() {
      var vw = window.innerWidth;
      var vh = window.innerHeight;
      var s = Math.min(vw / size.w, vh / size.h, 2);
      stage.style.width = size.w + &#x27;px&#x27;;
      stage.style.height = size.h + &#x27;px&#x27;;
      stage.style.transformOrigin = &#x27;0 0&#x27;;
      stage.style.transform = &#x27;scale(&#x27; + s + &#x27;)&#x27;;
      stage.style.left = Math.max(0, (vw - size.w * s) / 2) + &#x27;px&#x27;;
      stage.style.top = Math.max(0, (vh - size.h * s) / 2) + &#x27;px&#x27;;
    }
    window.addEventListener(&#x27;resize&#x27;, fit);
    fit();
    return comp;
  };
})();
&lt;/script&gt;
&lt;script&gt;

class Component extends DCLogic {
  S(st) {
    return Object.assign(this.D(), st || {});
  }

  fx(n) {
    if (n === 0) return &#x27;fx0&#x27;;
    return n % 2 === 1 ? &#x27;fxA&#x27; : &#x27;fxB&#x27;;
  }

  alt(prefix, n) {
    if (n === 0) return &#x27;&#x27;;
    return prefix + (n % 2 === 1 ? &#x27;A&#x27; : &#x27;B&#x27;);
  }

  burstParticles() {
    const particles = [];
    for (let i = 0; i &lt; 12; i++) {
      particles.push({ cls: &#x27;arm r&#x27; + i + &#x27; c&#x27; + (i % 4) });
    }
    return particles;
  }

  D() {
    return { S: 5, fx: 0 };
  }

  setS(S) {
    this.setState((st) =&gt; {
      const cur = this.S(st);
      if (S === cur.S) return null;
      return { S: S, fx: cur.fx + 1 };
    });
  }

  renderVals() {
    const s = this.S(this.state);
    const S = s.S;
    const f = (n) =&gt; n.toFixed(1);
    const P = (x, y) =&gt; f(x) + &#x27;,&#x27; + f(y);
    const S2 = S * S;
    const M = (S2 - 1) / 2;
    const c = M + 1;

    const u = Math.min(320 / S, 270 / M, 40);
    const Bh = S * u;
    const Av = M * u;
    const x0 = (500 - Bh) / 2;
    const y0 = 210 + Av / 2 + 10;
    const rmS = Math.min(18, 0.4 * Math.min(Av, Bh));
    const hl = Math.hypot(Av, Bh);
    const mx = x0 + Bh / 2;
    const my = y0 - Av / 2;
    const nx = Av / hl;
    const ny = -Bh / hl;

    const alt = s.fx % 2 === 1 ? &#x27;riseA&#x27; : &#x27;riseB&#x27;;
    const rise = (n) =&gt; (s.fx === 0 ? &#x27;&#x27; : alt + &#x27; d&#x27; + n);

    const hy = nx &gt; 0.5 ? { x: mx + nx * 14, y: my + ny * 14 + 6, anc: &#x27;start&#x27; } : { x: mx + nx * 26, y: my + ny * 26 + 6, anc: &#x27;middle&#x27; };
    const knowns = [{
      label: &#x27;S&#x27;,
      note: &#x27;sisi terpendek, ganjil &gt; 1&#x27;,
      val: S,
      decLabel: &#x27;Kurangi S&#x27;,
      incLabel: &#x27;Tambah S&#x27;,
      decDis: S &lt;= 3,
      incDis: S &gt;= 15,
      dec: () =&gt; this.setS(Math.max(3, S - 2)),
      inc: () =&gt; this.setS(Math.min(15, S + 2))
    }];
    const quick = [3, 5, 7, 9].map((n) =&gt; ({
      label: &#x27;S = &#x27; + n,
      cls: &#x27;btn press&#x27; + (S === n ? &#x27; on&#x27; : &#x27;&#x27;),
      pick: () =&gt; this.setS(n)
    }));

    const wM = 300 * M / c;
    const wOne = Math.max(300 / c, 4);

    return {
      particles: this.burstParticles(),
      fxCls: this.fx(s.fx),
      tri: P(x0, y0) + &#x27; &#x27; + P(x0, y0 - Av) + &#x27; &#x27; + P(x0 + Bh, y0),
      triAnim: s.fx === 0 ? &#x27;&#x27; : this.alt(&#x27;pop&#x27;, s.fx),
      rm: P(x0 + rmS, y0) + &#x27; &#x27; + P(x0 + rmS, y0 - rmS) + &#x27; &#x27; + P(x0, y0 - rmS),
      la: { x: f(x0 + Bh / 2), y: f(y0 + 30), t: &#x27;S = &#x27; + S, anc: &#x27;middle&#x27; },
      lb: { x: f(x0 - 10), y: f(y0 - Av / 2 + 6), t: &#x27;M = &#x27; + M, anc: &#x27;end&#x27; },
      lc: { x: f(hy.x), y: f(hy.y), t: &#x27;c = &#x27; + c, anc: hy.anc },
      caption: &#x27;Segitiga siku-siku dengan sisi terpendek S = &#x27; + S,
      knowns: knowns,
      quick: quick,
      rise1: rise(1),
      rise2: rise(2),
      rise3: rise(3),
      rise4: rise(4),
      t1: &#x27;M = (&#x27; + S + &#x27;² − 1) ÷ 2 = &#x27; + (S2 - 1) + &#x27; ÷ 2 = &#x27; + M,
      t2: &#x27;c = M + 1 = &#x27; + M + &#x27; + 1 = &#x27; + c,
      t3: &#x27;Triple Pythagoras: (&#x27; + S + &#x27;, &#x27; + M + &#x27;, &#x27; + c + &#x27;)&#x27;,
      t4: S + &#x27;² + &#x27; + M + &#x27;² = &#x27; + c + &#x27;²  →  &#x27; + S2 + &#x27; + &#x27; + (M * M) + &#x27; = &#x27; + (c * c) + &#x27; ✓&#x27;,
      wM: f(wM),
      wOne: f(wOne),
      tx: f(wM / 2),
      lM: wM &gt;= 60 ? &#x27;M = &#x27; + M : &#x27;&#x27;,
      lC: wM &gt;= 60 ? &#x27;c = &#x27; + c : &#x27;&#x27;
    };
  }
}

&lt;/script&gt;
&lt;script&gt;
DCMount(document.getElementById(&#x27;tpl&#x27;), document.getElementById(&#x27;stage&#x27;), Component, { w: 1000, h: 740 });
&lt;/script&gt;
