  window.DCMount = function (templateEl, mountEl, ComponentClass, size) {

      stage.style.height = size.h + &#x27;px&#x27;;

&lt;script&gt;

class Component extends DCLogic {
  S(st) {
    return Object.assign(this.D(), st || {});
  }

  fx(n) {
    if (n === 0) return &#x27;fx0&#x27;;
    return n % 2 === 1 ? &#x27;fxA&#x27; : &#x27;fxB&#x27;;
  }

  alt(prefix, n) {
    if (n === 0) return &#x27;&#x27;;
    return prefix + (n % 2 === 1 ? &#x27;A&#x27; : &#x27;B&#x27;);
  }

  burstParticles() {
    const particles = [];
    for (let i = 0; i &lt; 12; i++) {
      particles.push({ cls: &#x27;arm r&#x27; + i + &#x27; c&#x27; + (i % 4) });
    }
    return particles;
  }

  nf(x) {
    if (Math.abs(x - Math.round(x)) &lt; 1e-9) return String(Math.round(x));
    return x.toFixed(2).replace(&#x27;.&#x27;, &#x27;,&#x27;);
  }

  isInt(x) {
    return Math.abs(x - Math.round(x)) &lt; 1e-9;
  }

  commit(patch) {
    this.setState((st) =&gt; {
      const cur = this.S(st);
      const nxt = Object.assign({}, cur, patch);
      const out = Object.assign({}, patch);
      if (this.isBulat(nxt) &amp;&amp; !this.isBulat(cur)) out.fx = cur.fx + 1;
      return out;
    });
  }

  setNum(key, raw, min, max) {
    let v = Math.round(Number(raw));
    if (isNaN(v)) return;
    v = Math.max(min, Math.min(max, v));
    const patch = {};
    patch[key] = v;
    this.commit(patch);
  }

  pt(P) {
    return P[0].toFixed(1) + &#x27;,&#x27; + P[1].toFixed(1);
  }

  ps(P) {
    return P[0].toFixed(1) + &#x27; &#x27; + P[1].toFixed(1);
  }

  poly() {
    const a = Array.prototype.slice.call(arguments);
    return a.map((P) =&gt; this.pt(P)).join(&#x27; &#x27;);
  }

  unit(P, Q) {
    const dx = Q[0] - P[0];
    const dy = Q[1] - P[1];
    const L = Math.hypot(dx, dy) || 1;
    return [dx / L, dy / L];
  }

  rmark(V, P1, P2, s) {
    const u1 = this.unit(V, P1);
    const u2 = this.unit(V, P2);
    const a = [V[0] + s * u1[0], V[1] + s * u1[1]];
    const b = [V[0] + s * (u1[0] + u2[0]), V[1] + s * (u1[1] + u2[1])];
    const c = [V[0] + s * u2[0], V[1] + s * u2[1]];
    return this.poly(a, b, c);
  }

  mid(P, Q) {
    return [(P[0] + Q[0]) / 2, (P[1] + Q[1]) / 2];
  }

  geo(p, l, t, pyr) {
    const kx = 0.46;
    const ky = 0.30;
    const hu = pyr ? Math.max(t + l * ky / 2, l * ky) : t + l * ky;
    const u = Math.min(340 / (p + l * kx), 265 / hu, 46);
    const w = (p + l * kx) * u;
    const hh = hu * u;
    const ox = (500 - w) / 2;
    const oy = 212 + hh / 2 + 10;
    const pr = (x, y, z) =&gt; [ox + (x + y * kx) * u, oy - (z + y * ky) * u];
    return { u: u, pr: pr };
  }

  lab(P, dx, dy, t, c, anc, o) {
    return { x: (P[0] + dx).toFixed(1), y: (P[1] + dy).toFixed(1), t: t, c: c, anc: anc || &#x27;middle&#x27;, o: o === undefined ? &#x27;1&#x27; : o };
  }

  vl(P, dx, dy) {
    return { x: (P[0] + dx).toFixed(1), y: (P[1] + dy).toFixed(1) };
  }

  inset(legH, legV, tH, tV, tY, cH, cV, cY) {
    const s = Math.min(190 / legH, 40 / legV);
    const W = legH * s;
    const Hv = legV * s;
    const x0 = Math.max(78, (330 - W) / 2 + 24);
    const y0 = 68;
    const O = [x0, y0];
    const Hh = [x0 + W, y0];
    const V = [x0, y0 - Hv];
    const L = Math.hypot(W, Hv) || 1;
    const rs = Math.max(5, Math.min(12, W * 0.3, Hv * 0.3));
    const m = this.mid(V, Hh);
    return {
      pts: this.poly(O, Hh, V),
      rm: this.poly([x0 + rs, y0], [x0 + rs, y0 - rs], [x0, y0 - rs]),
      h: { x: (x0 + W / 2).toFixed(1), y: (y0 + 16).toFixed(1), t: tH, c: cH },
      v: { x: (x0 - 8).toFixed(1), y: (y0 - Hv / 2 + 5).toFixed(1), t: tV, c: cV },
      y: { x: (m[0] + Hv / L * 18).toFixed(1), y: (m[1] - W / L * 18 + 5).toFixed(1), t: tY, c: cY }
    };
  }

  sliderRow(key, label, cls, rng, min, max, val, show, aria, setter) {
    return { label: label, cls: cls, rng: rng, min: min, max: max, val: val, show: show, aria: aria, set: setter };
  }

  D() {
    return { p: 4, l: 3, t: 3, fx: 0 };
  }

  res(s) {
    return Math.sqrt(s.p * s.p + s.l * s.l);
  }

  isBulat(s) {
    return this.isInt(this.res(s));
  }

  renderVals() {
    const s = this.S(this.state);
    const p = s.p;
    const l = s.l;
    const t = s.t;
    const g = this.geo(p, l, t, false);
    const pr = g.pr;
    const A = pr(0, 0, 0);
    const B = pr(p, 0, 0);
    const C = pr(p, l, 0);
    const D = pr(0, l, 0);
    const E = pr(0, 0, t);
    const F = pr(p, 0, t);
    const G = pr(p, l, t);
    const H = pr(0, l, t);
    const ps = (P) =&gt; this.ps(P);
    const vis = &#x27;M&#x27; + ps(A) + &#x27; L&#x27; + ps(B) + &#x27; L&#x27; + ps(F) + &#x27; L&#x27; + ps(E) + &#x27; Z M&#x27; + ps(B) + &#x27; L&#x27; + ps(C) + &#x27; L&#x27; + ps(G) + &#x27; L&#x27; + ps(F) + &#x27; M&#x27; + ps(E) + &#x27; L&#x27; + ps(H) + &#x27; L&#x27; + ps(G);
    const hid = &#x27;M&#x27; + ps(D) + &#x27; L&#x27; + ps(A) + &#x27; M&#x27; + ps(D) + &#x27; L&#x27; + ps(C) + &#x27; M&#x27; + ps(D) + &#x27; L&#x27; + ps(H);

    const sum = p * p + l * l;
    const bd = Math.sqrt(sum);
    const bulat = this.isInt(bd);
    const mBD = this.mid(B, D);
    const mAB = this.mid(A, B);
    const mBC = this.mid(B, C);
    const mEA = this.mid(E, A);

    const sliders = [
      this.sliderRow(&#x27;p&#x27;, &#x27;p&#x27;, &#x27;cA&#x27;, &#x27;sA&#x27;, 1, 12, p, p, &#x27;Panjang p&#x27;, (e) =&gt; this.setNum(&#x27;p&#x27;, e.target.value, 1, 12)),
      this.sliderRow(&#x27;l&#x27;, &#x27;l&#x27;, &#x27;cB&#x27;, &#x27;sB&#x27;, 1, 12, l, l, &#x27;Lebar l&#x27;, (e) =&gt; this.setNum(&#x27;l&#x27;, e.target.value, 1, 12)),
      this.sliderRow(&#x27;t&#x27;, &#x27;t&#x27;, &#x27;cD&#x27;, &#x27;sD&#x27;, 1, 12, t, t, &#x27;Tinggi t&#x27;, (e) =&gt; this.setNum(&#x27;t&#x27;, e.target.value, 1, 12))
    ];
    const presets = [[3, 4], [6, 8], [5, 12], [8, 15]].map((q) =&gt; ({
      label: q[0] + &#x27; &amp; &#x27; + q[1],
      pressed: p === q[0] &amp;&amp; l === q[1],
      cls: &#x27;btn press&#x27; + (p === q[0] &amp;&amp; l === q[1] ? &#x27; on&#x27; : &#x27;&#x27;),
      pick: () =&gt; this.commit({ p: q[0], l: q[1] })
    }));

    const ins = this.inset(p, l, &#x27;p = &#x27; + p, &#x27;l = &#x27; + l, &#x27;BD = &#x27; + this.nf(bd), &#x27;#1D4780&#x27;, &#x27;#145A3B&#x27;, &#x27;#B02A24&#x27;);
    const tup = [p, l].sort((x, y) =&gt; x - y);
    return {
      particles: this.burstParticles(),
      fxCls: this.fx(s.fx),
      fBase: this.poly(A, B, C, D),
      fFront: this.poly(A, B, F, E),
      fRight: this.poly(B, C, G, F),
      fTop: this.poly(E, F, G, H),
      vis: vis,
      hid: hid,
      tri: this.poly(A, B, D),
      dg: { x1: B[0].toFixed(1), y1: B[1].toFixed(1), x2: D[0].toFixed(1), y2: D[1].toFixed(1) },
      rm: this.rmark(A, B, D, 15),
      vA: this.vl(A, -16, 24),
      vB: this.vl(B, 14, 24),
      vC: this.vl(C, 18, 8),
      vD: this.vl(D, -16, 2),
      vE: this.vl(E, -18, 4),
      vF: this.vl(F, -4, 26),
      vG: this.vl(G, 18, -4),
      vH: this.vl(H, -14, -8),
      lp: this.lab(mAB, 0, 52, &#x27;p = &#x27; + p, &#x27;#1D4780&#x27;),
      ll: this.lab(mBC, 14, 8, &#x27;l = &#x27; + l, &#x27;#145A3B&#x27;, &#x27;start&#x27;),
      lt: this.lab(mEA, -12, 5, &#x27;t = &#x27; + t, &#x27;#6A3590&#x27;, &#x27;end&#x27;),
      ld: this.lab(mBD, -6, -14, &#x27;BD = &#x27; + this.nf(bd), &#x27;#B02A24&#x27;),
      caption: &#x27;Balok ABCD.EFGH dengan p = &#x27; + p + &#x27;, l = &#x27; + l + &#x27;, t = &#x27; + t,
      sliders: sliders,
      presets: presets,
      keyF: &#x27;BD = √(p² + l²)&#x27;,
      keyT: &#x27;Diagonal bidang alas balok diperoleh dari akar jumlah kuadrat panjang dan lebarnya.&#x27;,
      boxCls: bulat ? &#x27;verdict right &#x27; + this.alt(&#x27;pop&#x27;, s.fx) : &#x27;verdict&#x27;,
      big: bulat ? &#x27;BD = &#x27; + this.nf(bd) : &#x27;BD ≈ &#x27; + this.nf(bd),
      l1: &#x27;Segitiga ABD siku-siku di A&#x27;,
      l2: &#x27;BD² = AB² + AD² = p² + l²&#x27;,
      l3: &#x27;BD² = &#x27; + p + &#x27;² + &#x27; + l + &#x27;² = &#x27; + (p * p) + &#x27; + &#x27; + (l * l) + &#x27; = &#x27; + sum,

      inTitle: &#x27;Segitiga ABD (siku-siku di A)&#x27;,
      inPts: ins.pts, inRm: ins.rm, inH: ins.h, inV: ins.v, inY: ins.y

  }

    if (Math.abs(x - Math.round(x)) &lt; 1e-9) return String(Math.round(x));
    return x.toFixed(2).replace(&#x27;.&#x27;, &#x27;,&#x27;);
  }

  isInt(x) {
    return Math.abs(x - Math.round(x)) &lt; 1e-9;
  }

  commit(patch) {
    this.setState((st) =&gt; {
      const cur = this.S(st);
      const nxt = Object.assign({}, cur, patch);
      const out = Object.assign({}, patch);
      if (this.isBulat(nxt) &amp;&amp; !this.isBulat(cur)) out.fx = cur.fx + 1;
      return out;
    });
  }

  setNum(key, raw, min, max) {
    let v = Math.round(Number(raw));
    if (isNaN(v)) return;
    v = Math.max(min, Math.min(max, v));
    const patch = {};
    patch[key] = v;
    this.commit(patch);
  }

  pt(P) {
    return P[0].toFixed(1) + &#x27;,&#x27; + P[1].toFixed(1);
  }

  ps(P) {
    return P[0].toFixed(1) + &#x27; &#x27; + P[1].toFixed(1);
  }

  poly() {
    const a = Array.prototype.slice.call(arguments);
    return a.map((P) =&gt; this.pt(P)).join(&#x27; &#x27;);
  }

  unit(P, Q) {
    const dx = Q[0] - P[0];
    const dy = Q[1] - P[1];
    const L = Math.hypot(dx, dy) || 1;
    return [dx / L, dy / L];
  }

  rmark(V, P1, P2, s) {
    const u1 = this.unit(V, P1);
    const u2 = this.unit(V, P2);
    const a = [V[0] + s * u1[0], V[1] + s * u1[1]];
    const b = [V[0] + s * (u1[0] + u2[0]), V[1] + s * (u1[1] + u2[1])];
    const c = [V[0] + s * u2[0], V[1] + s * u2[1]];
    return this.poly(a, b, c);
  }

  mid(P, Q) {
    return [(P[0] + Q[0]) / 2, (P[1] + Q[1]) / 2];
  }

  geo(p, l, t, pyr) {
    const kx = 0.46;
    const ky = 0.30;
    const hu = pyr ? Math.max(t + l * ky / 2, l * ky) : t + l * ky;
    const u = Math.min(340 / (p + l * kx), 265 / hu, 46);
    const w = (p + l * kx) * u;
    const hh = hu * u;
    const ox = (500 - w) / 2;
    const oy = 212 + hh / 2 + 10;
    const pr = (x, y, z) =&gt; [ox + (x + y * kx) * u, oy - (z + y * ky) * u];
    return { u: u, pr: pr };
  }

  lab(P, dx, dy, t, c, anc, o) {
    return { x: (P[0] + dx).toFixed(1), y: (P[1] + dy).toFixed(1), t: t, c: c, anc: anc || &#x27;middle&#x27;, o: o === undefined ? &#x27;1&#x27; : o };
  }

  vl(P, dx, dy) {
    return { x: (P[0] + dx).toFixed(1), y: (P[1] + dy).toFixed(1) };
  }

  inset(legH, legV, tH, tV, tY, cH, cV, cY) {
    const s = Math.min(190 / legH, 40 / legV);
    const W = legH * s;
    const Hv = legV * s;
    const x0 = Math.max(78, (330 - W) / 2 + 24);
    const y0 = 68;
    const O = [x0, y0];
    const Hh = [x0 + W, y0];
    const V = [x0, y0 - Hv];
    const L = Math.hypot(W, Hv) || 1;
    const rs = Math.max(5, Math.min(12, W * 0.3, Hv * 0.3));
    const m = this.mid(V, Hh);
    return {
      pts: this.poly(O, Hh, V),
      rm: this.poly([x0 + rs, y0], [x0 + rs, y0 - rs], [x0, y0 - rs]),
      h: { x: (x0 + W / 2).toFixed(1), y: (y0 + 16).toFixed(1), t: tH, c: cH },
      v: { x: (x0 - 8).toFixed(1), y: (y0 - Hv / 2 + 5).toFixed(1), t: tV, c: cV },
      y: { x: (m[0] + Hv / L * 18).toFixed(1), y: (m[1] - W / L * 18 + 5).toFixed(1), t: tY, c: cY }
    };
  }

  sliderRow(key, label, cls, rng, min, max, val, show, aria, setter) {
    return { label: label, cls: cls, rng: rng, min: min, max: max, val: val, show: show, aria: aria, set: setter };
  }

  D() {
    return { p: 4, l: 4, t: 7, step: 1, fx: 0 };
  }

  res(s) {
    return Math.sqrt(s.p * s.p + s.l * s.l + s.t * s.t);
  }

  isBulat(s) {
    return this.isInt(this.res(s));
  }

  renderVals() {
    const s = this.S(this.state);
    const p = s.p;
    const l = s.l;
    const t = s.t;
    const step = s.step;
    const g = this.geo(p, l, t, false);
    const pr = g.pr;
    const A = pr(0, 0, 0);
    const B = pr(p, 0, 0);
    const C = pr(p, l, 0);
    const D = pr(0, l, 0);
    const E = pr(0, 0, t);
    const F = pr(p, 0, t);
    const G = pr(p, l, t);
    const H = pr(0, l, t);
    const ps = (P) =&gt; this.ps(P);
    const vis = &#x27;M&#x27; + ps(A) + &#x27; L&#x27; + ps(B) + &#x27; L&#x27; + ps(F) + &#x27; L&#x27; + ps(E) + &#x27; Z M&#x27; + ps(B) + &#x27; L&#x27; + ps(C) + &#x27; L&#x27; + ps(G) + &#x27; L&#x27; + ps(F) + &#x27; M&#x27; + ps(E) + &#x27; L&#x27; + ps(H) + &#x27; L&#x27; + ps(G);
    const hid = &#x27;M&#x27; + ps(D) + &#x27; L&#x27; + ps(A) + &#x27; M&#x27; + ps(D) + &#x27; L&#x27; + ps(C) + &#x27; M&#x27; + ps(D) + &#x27; L&#x27; + ps(H);

    const bd2 = p * p + l * l;
    const bd = Math.sqrt(bd2);
    const hb2 = bd2 + t * t;
    const hb = Math.sqrt(hb2);
    const bulat = this.isInt(hb);
    const s1 = step === 1;
    const seg = (P, Q) =&gt; ({ x1: P[0].toFixed(1), y1: P[1].toFixed(1), x2: Q[0].toFixed(1), y2: Q[1].toFixed(1) });

    const sliders = [
      this.sliderRow(&#x27;p&#x27;, &#x27;p&#x27;, &#x27;cA&#x27;, &#x27;sA&#x27;, 1, 12, p, p, &#x27;Panjang p&#x27;, (e) =&gt; this.setNum(&#x27;p&#x27;, e.target.value, 1, 12)),
      this.sliderRow(&#x27;l&#x27;, &#x27;l&#x27;, &#x27;cB&#x27;, &#x27;sB&#x27;, 1, 12, l, l, &#x27;Lebar l&#x27;, (e) =&gt; this.setNum(&#x27;l&#x27;, e.target.value, 1, 12)),
      this.sliderRow(&#x27;t&#x27;, &#x27;t&#x27;, &#x27;cD&#x27;, &#x27;sD&#x27;, 1, 12, t, t, &#x27;Tinggi t&#x27;, (e) =&gt; this.setNum(&#x27;t&#x27;, e.target.value, 1, 12))
    ];
    const steps = [
      { n: 1, label: &#x27;Langkah 1: BD&#x27; },
      { n: 2, label: &#x27;Langkah 2: HB&#x27; }
    ].map((q) =&gt; ({
      label: q.label,
      pressed: step === q.n,
      cls: &#x27;btn press&#x27; + (step === q.n ? &#x27; on&#x27; : &#x27;&#x27;),
      pick: () =&gt; this.setState({ step: q.n })
    }));
    const presets = [[2, 3, 6], [1, 2, 2], [2, 4, 4], [4, 4, 7]].map((q) =&gt; ({
      label: q[0] + &#x27;, &#x27; + q[1] + &#x27;, &#x27; + q[2],
      pressed: p === q[0] &amp;&amp; l === q[1] &amp;&amp; t === q[2],
      cls: &#x27;btn press&#x27; + (p === q[0] &amp;&amp; l === q[1] &amp;&amp; t === q[2] ? &#x27; on&#x27; : &#x27;&#x27;),
      pick: () =&gt; this.commit({ p: q[0], l: q[1], t: q[2] })
    }));

    const ins = s1
      ? this.inset(p, l, &#x27;p = &#x27; + p, &#x27;l = &#x27; + l, &#x27;BD = &#x27; + this.nf(bd), &#x27;#1D4780&#x27;, &#x27;#145A3B&#x27;, &#x27;#B8520A&#x27;)
      : this.inset(bd, t, &#x27;BD = &#x27; + this.nf(bd), &#x27;t = &#x27; + t, &#x27;HB = &#x27; + this.nf(hb), &#x27;#B8520A&#x27;, &#x27;#6A3590&#x27;, &#x27;#B02A24&#x27;);

    return {
      particles: this.burstParticles(),
      fxCls: this.fx(s.fx),
      fBase: this.poly(A, B, C, D),
      fFront: this.poly(A, B, F, E),
      fRight: this.poly(B, C, G, F),
      fTop: this.poly(E, F, G, H),
      vis: vis,
      hid: hid,
      tri1: this.poly(A, B, D),
      tri2: this.poly(B, D, H),
      o1: s1 ? &#x27;1&#x27; : &#x27;0&#x27;,
      o2: s1 ? &#x27;0&#x27; : &#x27;1&#x27;,
      bd: seg(B, D),
      bdC: s1 ? &#x27;#D0342C&#x27; : &#x27;#B8520A&#x27;,
      bdW: s1 ? &#x27;5&#x27; : &#x27;4&#x27;,
      bdCls: s1 ? &#x27;dash&#x27; : &#x27;&#x27;,
      hb: seg(H, B),
      hbCls: s1 ? &#x27;&#x27; : &#x27;dash&#x27;,
      hbW: s1 ? &#x27;4&#x27; : &#x27;5&#x27;,
      rm1: this.rmark(A, B, D, 15),
      rm2: this.rmark(D, B, H, 15),
      vA: this.vl(A, -16, 24),
      vB: this.vl(B, 14, 24),
      vC: this.vl(C, 18, 8),
      vD: this.vl(D, -16, 2),
      vE: this.vl(E, -18, 4),
      vF: this.vl(F, -4, 26),
      vG: this.vl(G, 18, -4),
      vH: this.vl(H, -14, -8),
      lp: this.lab(this.mid(A, B), 0, 52, &#x27;p = &#x27; + p, &#x27;#1D4780&#x27;),
      ll: this.lab(this.mid(B, C), 14, 8, &#x27;l = &#x27; + l, &#x27;#145A3B&#x27;, &#x27;start&#x27;),
      lt: this.lab(this.mid(E, A), -12, 5, &#x27;t = &#x27; + t, &#x27;#6A3590&#x27;, &#x27;end&#x27;),
      ld: this.lab(this.mid(B, D), -6, 22, &#x27;BD = &#x27; + this.nf(bd), &#x27;#B8520A&#x27;),
      lh: this.lab(this.mid(H, B), 18, -8, &#x27;HB = &#x27; + this.nf(hb), &#x27;#B02A24&#x27;, &#x27;start&#x27;, &#x27;1&#x27;),
      caption: &#x27;Balok ABCD.EFGH dengan p = &#x27; + p + &#x27;, l = &#x27; + l + &#x27;, t = &#x27; + t,
      sliders: sliders,
      steps: steps,
      keyF: &#x27;d = √(p² + l² + t²)&#x27;,
      keyT: &#x27;Diagonal ruang balok diperoleh dengan menggabungkan kuadrat panjang, lebar, dan tinggi balok, lalu diakarkan.&#x27;,
      presets: presets,
      boxCls: bulat ? &#x27;verdict right &#x27; + this.alt(&#x27;pop&#x27;, s.fx) : &#x27;verdict&#x27;,
      big: bulat ? &#x27;HB = &#x27; + this.nf(hb) : &#x27;HB ≈ &#x27; + this.nf(hb),
      l1: &#x27;BD² = p² + l² = &#x27; + (p * p) + &#x27; + &#x27; + (l * l) + &#x27; = &#x27; + bd2,
      l2: &#x27;HB² = BD² + DH² = &#x27; + bd2 + &#x27; + &#x27; + (t * t) + &#x27; = &#x27; + hb2,
      l3: bulat ? &#x27;HB = √&#x27; + hb2 + &#x27; = &#x27; + this.nf(hb) : &#x27;HB = √&#x27; + hb2 + &#x27; ≈ &#x27; + this.nf(hb),
      l1Cls: s1 ? &#x27;hl&#x27; : &#x27;&#x27;,
      l2Cls: s1 ? &#x27;&#x27; : &#x27;hl&#x27;,
      l3Cls: s1 ? &#x27;&#x27; : &#x27;hl&#x27;,
      isBulat: bulat,
      note: &#x27;Rumus: d = √(p² + l² + t²). Hasilnya bulat!&#x27;,
      inTitle: s1 ? &#x27;Segitiga ABD (siku-siku di A)&#x27; : &#x27;Segitiga BDH (siku-siku di D)&#x27;,
      inPts: ins.pts, inRm: ins.rm, inH: ins.h, inV: ins.v, inY: ins.y
    };
  }
}

    if (Math.abs(x - Math.round(x)) &lt; 1e-9) return String(Math.round(x));
    return x.toFixed(2).replace(&#x27;.&#x27;, &#x27;,&#x27;);
  }

  isInt(x) {
    return Math.abs(x - Math.round(x)) &lt; 1e-9;
  }

  commit(patch) {
    this.setState((st) =&gt; {
      const cur = this.S(st);
      const nxt = Object.assign({}, cur, patch);
      const out = Object.assign({}, patch);
      if (this.isBulat(nxt) &amp;&amp; !this.isBulat(cur)) out.fx = cur.fx + 1;
      return out;
    });
  }

  setNum(key, raw, min, max) {
    let v = Math.round(Number(raw));
    if (isNaN(v)) return;
    v = Math.max(min, Math.min(max, v));
    const patch = {};
    patch[key] = v;
    this.commit(patch);
  }

  pt(P) {
    return P[0].toFixed(1) + &#x27;,&#x27; + P[1].toFixed(1);
  }

  ps(P) {
    return P[0].toFixed(1) + &#x27; &#x27; + P[1].toFixed(1);
  }

  poly() {
    const a = Array.prototype.slice.call(arguments);
    return a.map((P) =&gt; this.pt(P)).join(&#x27; &#x27;);
  }

  unit(P, Q) {
    const dx = Q[0] - P[0];
    const dy = Q[1] - P[1];
    const L = Math.hypot(dx, dy) || 1;
    return [dx / L, dy / L];
  }

  rmark(V, P1, P2, s) {
    const u1 = this.unit(V, P1);
    const u2 = this.unit(V, P2);
    const a = [V[0] + s * u1[0], V[1] + s * u1[1]];
    const b = [V[0] + s * (u1[0] + u2[0]), V[1] + s * (u1[1] + u2[1])];
    const c = [V[0] + s * u2[0], V[1] + s * u2[1]];
    return this.poly(a, b, c);
  }

  mid(P, Q) {
    return [(P[0] + Q[0]) / 2, (P[1] + Q[1]) / 2];
  }

  geo(p, l, t, pyr) {
    const kx = 0.46;
    const ky = 0.30;
    const hu = pyr ? Math.max(t + l * ky / 2, l * ky) : t + l * ky;
    const u = Math.min(340 / (p + l * kx), 265 / hu, 46);
    const w = (p + l * kx) * u;
    const hh = hu * u;
    const ox = (500 - w) / 2;
    const oy = 212 + hh / 2 + 10;
    const pr = (x, y, z) =&gt; [ox + (x + y * kx) * u, oy - (z + y * ky) * u];
    return { u: u, pr: pr };
  }

  lab(P, dx, dy, t, c, anc, o) {
    return { x: (P[0] + dx).toFixed(1), y: (P[1] + dy).toFixed(1), t: t, c: c, anc: anc || &#x27;middle&#x27;, o: o === undefined ? &#x27;1&#x27; : o };
  }

  vl(P, dx, dy) {
    return { x: (P[0] + dx).toFixed(1), y: (P[1] + dy).toFixed(1) };
  }

  inset(legH, legV, tH, tV, tY, cH, cV, cY) {
    const s = Math.min(190 / legH, 40 / legV);
    const W = legH * s;
    const Hv = legV * s;
    const x0 = Math.max(78, (330 - W) / 2 + 24);
    const y0 = 68;
    const O = [x0, y0];
    const Hh = [x0 + W, y0];
    const V = [x0, y0 - Hv];
    const L = Math.hypot(W, Hv) || 1;
    const rs = Math.max(5, Math.min(12, W * 0.3, Hv * 0.3));
    const m = this.mid(V, Hh);
    return {
      pts: this.poly(O, Hh, V),
      rm: this.poly([x0 + rs, y0], [x0 + rs, y0 - rs], [x0, y0 - rs]),
      h: { x: (x0 + W / 2).toFixed(1), y: (y0 + 16).toFixed(1), t: tH, c: cH },
      v: { x: (x0 - 8).toFixed(1), y: (y0 - Hv / 2 + 5).toFixed(1), t: tV, c: cV },
      y: { x: (m[0] + Hv / L * 18).toFixed(1), y: (m[1] - W / L * 18 + 5).toFixed(1), t: tY, c: cY }
    };
  }

  sliderRow(key, label, cls, rng, min, max, val, show, aria, setter) {
    return { label: label, cls: cls, rng: rng, min: min, max: max, val: val, show: show, aria: aria, set: setter };
  }

  D() {
    return { p: 6, l: 8, t: 12, step: 3, fx: 0 };
  }

  res(s) {
    return Math.sqrt(s.t * s.t + (s.p * s.p + s.l * s.l) / 4);
  }

  isBulat(s) {
    return this.isInt(this.res(s));
  }

  renderVals() {
    const s = this.S(this.state);
    const p = s.p;
    const l = s.l;
    const t = s.t;
    const step = s.step;
    const g = this.geo(p, l, t, true);
    const pr = g.pr;
    const A = pr(0, 0, 0);
    const B = pr(p, 0, 0);
    const C = pr(p, l, 0);
    const D = pr(0, l, 0);
    const E = pr(p / 2, l / 2, 0);
    const T = pr(p / 2, l / 2, t);
    const ps = (P) =&gt; this.ps(P);
    const vis = &#x27;M&#x27; + ps(A) + &#x27; L&#x27; + ps(B) + &#x27; L&#x27; + ps(C) + &#x27; M&#x27; + ps(T) + &#x27; L&#x27; + ps(A) + &#x27; M&#x27; + ps(T) + &#x27; L&#x27; + ps(B) + &#x27; M&#x27; + ps(T) + &#x27; L&#x27; + ps(C);
    const hid = &#x27;M&#x27; + ps(A) + &#x27; L&#x27; + ps(D) + &#x27; L&#x27; + ps(C) + &#x27; M&#x27; + ps(D) + &#x27; L&#x27; + ps(T);
    const seg = (P, Q) =&gt; ({ x1: P[0].toFixed(1), y1: P[1].toFixed(1), x2: Q[0].toFixed(1), y2: Q[1].toFixed(1) });

    const bd2 = p * p + l * l;
    const bd = Math.sqrt(bd2);
    const be = bd / 2;
    const be2 = bd2 / 4;
    const tb2 = t * t + be2;
    const tb = Math.sqrt(tb2);
    const bulat = this.isInt(tb);

    const sliders = [
      this.sliderRow(&#x27;p&#x27;, &#x27;p&#x27;, &#x27;cA&#x27;, &#x27;sA&#x27;, 1, 12, p, p, &#x27;Panjang alas p&#x27;, (e) =&gt; this.setNum(&#x27;p&#x27;, e.target.value, 1, 12)),
      this.sliderRow(&#x27;l&#x27;, &#x27;l&#x27;, &#x27;cB&#x27;, &#x27;sB&#x27;, 1, 12, l, l, &#x27;Lebar alas l&#x27;, (e) =&gt; this.setNum(&#x27;l&#x27;, e.target.value, 1, 12)),
      this.sliderRow(&#x27;t&#x27;, &#x27;t&#x27;, &#x27;cD&#x27;, &#x27;sD&#x27;, 1, 12, t, t, &#x27;Tinggi limas t&#x27;, (e) =&gt; this.setNum(&#x27;t&#x27;, e.target.value, 1, 12))
    ];
    const steps = [
      { n: 1, label: &#x27;1 · BD&#x27; },
      { n: 2, label: &#x27;2 · BE&#x27; },
      { n: 3, label: &#x27;3 · TB&#x27; }
    ].map((q) =&gt; ({
      label: q.label,
      pressed: step === q.n,
      cls: &#x27;btn press&#x27; + (step === q.n ? &#x27; on&#x27; : &#x27;&#x27;),
      pick: () =&gt; this.setState({ step: q.n })
    }));
    const presets = [
      { v: [4, 4, 5], label: &#x27;Persegi&#x27; },
      { v: [6, 8, 12], label: &#x27;Hasil bulat&#x27; },
      { v: [10, 3, 2], label: &#x27;Pendek&#x27; }
    ].map((q) =&gt; ({
      label: q.label,
      pressed: p === q.v[0] &amp;&amp; l === q.v[1] &amp;&amp; t === q.v[2],
      cls: &#x27;btn press&#x27; + (p === q.v[0] &amp;&amp; l === q.v[1] &amp;&amp; t === q.v[2] ? &#x27; on&#x27; : &#x27;&#x27;),
      pick: () =&gt; this.commit({ p: q.v[0], l: q.v[1], t: q.v[2] })
    }));

    let ins;
    let inTitle;
    if (step === 1) {
      ins = this.inset(p, l, &#x27;p = &#x27; + p, &#x27;l = &#x27; + l, &#x27;BD = &#x27; + this.nf(bd), &#x27;#1D4780&#x27;, &#x27;#145A3B&#x27;, &#x27;#B8520A&#x27;);
      inTitle = &#x27;Segitiga ABD (siku-siku di A)&#x27;;
    } else if (step === 2) {
      ins = this.inset(p, l, &#x27;p = &#x27; + p, &#x27;l = &#x27; + l, &#x27;BD = &#x27; + this.nf(bd), &#x27;#1D4780&#x27;, &#x27;#145A3B&#x27;, &#x27;#B8520A&#x27;);
      inTitle = &#x27;E titik tengah BD, jadi BE = ½ × BD = &#x27; + this.nf(be);
    } else {
      ins = this.inset(be, t, &#x27;BE = &#x27; + this.nf(be), &#x27;TE = t = &#x27; + t, &#x27;TB = &#x27; + this.nf(tb), &#x27;#B8520A&#x27;, &#x27;#6A3590&#x27;, &#x27;#B02A24&#x27;);
      inTitle = &#x27;Segitiga TEB (siku-siku di E)&#x27;;
    }
    const o = (on) =&gt; (on ? &#x27;1&#x27; : &#x27;0&#x27;);
    const eV = this.unit(E, B);
    const eUp = [E[0], E[1] - 40];

    return {
      particles: this.burstParticles(),
      fxCls: this.fx(s.fx),
      fBase: this.poly(A, B, C, D),
      fFront: this.poly(T, A, B),
      fRight: this.poly(T, B, C),
      vis: vis,
      hid: hid,
      tri1: this.poly(A, B, D),
      tri3: this.poly(T, E, B),
      o1: o(step === 1),
      o3: o(step === 3),
      o23: o(step &gt;= 2),
      te: seg(T, E),
      teW: step === 3 ? &#x27;5&#x27; : &#x27;3&#x27;,
      bd: seg(B, D),
      bdC: step === 1 ? &#x27;#D0342C&#x27; : &#x27;#B8520A&#x27;,
      bdW: step === 1 ? &#x27;5&#x27; : &#x27;2.5&#x27;,
      bdCls: step === 1 ? &#x27;dash&#x27; : &#x27;&#x27;,
      be: seg(B, E),
      tb: seg(T, B),
      eDot: { x: E[0].toFixed(1), y: E[1].toFixed(1) },
      rm1: this.rmark(A, B, D, 15),
      rm3: this.rmark(E, B, eUp, 13),
      vA: this.vl(A, -16, 24),
      vB: this.vl(B, 14, 24),
      vC: this.vl(C, 18, 8),
      vD: this.vl(D, -16, 2),
      vE: this.vl(E, -16, 24),
      vT: this.vl(T, 0, -16),
      lp: this.lab(this.mid(A, B), 0, 52, &#x27;p = &#x27; + p, &#x27;#1D4780&#x27;),
      ll: this.lab(this.mid(B, C), 14, 8, &#x27;l = &#x27; + l, &#x27;#145A3B&#x27;, &#x27;start&#x27;),
      lbd: this.lab(this.mid(B, D), -34, 26, &#x27;BD = &#x27; + this.nf(bd), &#x27;#B8520A&#x27;, &#x27;middle&#x27;, o(step === 1)),
      lbe: this.lab(this.mid(B, E), -6, 38, &#x27;BE = &#x27; + this.nf(be), &#x27;#B8520A&#x27;, &#x27;middle&#x27;, o(step === 2)),
      lte: this.lab(this.mid(T, E), -10, 5, &#x27;t = &#x27; + t, &#x27;#6A3590&#x27;, &#x27;end&#x27;, o(step === 3)),
      ltb: this.lab(this.mid(T, B), 14, -4, &#x27;TB = &#x27; + this.nf(tb), &#x27;#B02A24&#x27;, &#x27;start&#x27;, o(step === 3)),
      caption: &#x27;Limas T.ABCD dengan alas &#x27; + p + &#x27; × &#x27; + l + &#x27; dan tinggi &#x27; + t,
      sliders: sliders,
      keyF: &#x27;TB = √(t² + (p² + l²) ÷ 4)&#x27;,
      keyT: &#x27;Rusuk tegak limas diperoleh dari akar jumlah kuadrat tinggi limas dan kuadrat setengah diagonal alas.&#x27;,
      steps: steps,
      presets: presets,
      boxCls: bulat ? &#x27;verdict right &#x27; + this.alt(&#x27;pop&#x27;, s.fx) : &#x27;verdict&#x27;,
      big: bulat ? &#x27;TB = &#x27; + this.nf(tb) : &#x27;TB ≈ &#x27; + this.nf(tb),
      l1: &#x27;BD = √(p² + l²) = √&#x27; + bd2 + (this.isInt(bd) ? &#x27; = &#x27; : &#x27; ≈ &#x27;) + this.nf(bd),
      l2: &#x27;BE = ½ × BD &#x27; + (this.isInt(be) ? &#x27;= &#x27; : &#x27;≈ &#x27;) + this.nf(be),
      l3: &#x27;TB² = t² + BE² = &#x27; + (t * t) + &#x27; + &#x27; + this.nf(be2) + &#x27; = &#x27; + this.nf(tb2),
      l4: bulat ? &#x27;TB = √&#x27; + this.nf(tb2) + &#x27; = &#x27; + this.nf(tb) : &#x27;TB = √&#x27; + this.nf(tb2) + &#x27; ≈ &#x27; + this.nf(tb),
      l1Cls: step === 1 ? &#x27;hl&#x27; : &#x27;&#x27;,
      l2Cls: step === 2 ? &#x27;hl&#x27; : &#x27;&#x27;,
      l3Cls: step === 3 ? &#x27;hl&#x27; : &#x27;&#x27;,
      l4Cls: step === 3 ? &#x27;hl&#x27; : &#x27;&#x27;,
      isBulat: bulat,
      note: &#x27;Rumus: TB = √(t² + (p² + l²) ÷ 4). Hasilnya bulat!&#x27;,
      inTitle: inTitle,
      inPts: ins.pts, inRm: ins.rm, inH: ins.h, inV: ins.v, inY: ins.y
    };
  }
}

&lt;/script&gt;

  }

  nf(x) {
    if (Math.abs(x - Math.round(x)) &lt; 1e-9) return String(Math.round(x));
    return x.toFixed(2).replace(&#x27;.&#x27;, &#x27;,&#x27;);
  }

  isInt(x) {
    return Math.abs(x - Math.round(x)) &lt; 1e-9;
  }

  commit(patch) {
    this.setState((st) =&gt; {
      const cur = this.S(st);
      const nxt = Object.assign({}, cur, patch);
      const out = Object.assign({}, patch);
      if (this.isBulat(nxt) &amp;&amp; !this.isBulat(cur)) out.fx = cur.fx + 1;
      return out;
    });
  }

  setNum(key, raw, min, max) {
    let v = Math.round(Number(raw));
    if (isNaN(v)) return;
    v = Math.max(min, Math.min(max, v));
    const patch = {};
    patch[key] = v;
    this.commit(patch);
  }

  pt(P) {
    return P[0].toFixed(1) + &#x27;,&#x27; + P[1].toFixed(1);
  }

  ps(P) {
    return P[0].toFixed(1) + &#x27; &#x27; + P[1].toFixed(1);
  }

  poly() {
    const a = Array.prototype.slice.call(arguments);
    return a.map((P) =&gt; this.pt(P)).join(&#x27; &#x27;);
  }

  unit(P, Q) {
    const dx = Q[0] - P[0];
    const dy = Q[1] - P[1];
    const L = Math.hypot(dx, dy) || 1;
    return [dx / L, dy / L];
  }

  rmark(V, P1, P2, s) {
    const u1 = this.unit(V, P1);
    const u2 = this.unit(V, P2);
    const a = [V[0] + s * u1[0], V[1] + s * u1[1]];
    const b = [V[0] + s * (u1[0] + u2[0]), V[1] + s * (u1[1] + u2[1])];
    const c = [V[0] + s * u2[0], V[1] + s * u2[1]];
    return this.poly(a, b, c);
  }

  mid(P, Q) {
    return [(P[0] + Q[0]) / 2, (P[1] + Q[1]) / 2];
  }

  geo(p, l, t, pyr) {
    const kx = 0.46;
    const ky = 0.30;
    const hu = pyr ? Math.max(t + l * ky / 2, l * ky) : t + l * ky;
    const u = Math.min(340 / (p + l * kx), 265 / hu, 46);
    const w = (p + l * kx) * u;
    const hh = hu * u;
    const ox = (500 - w) / 2;
    const oy = 212 + hh / 2 + 10;
    const pr = (x, y, z) =&gt; [ox + (x + y * kx) * u, oy - (z + y * ky) * u];
    return { u: u, pr: pr };
  }

  lab(P, dx, dy, t, c, anc, o) {
    return { x: (P[0] + dx).toFixed(1), y: (P[1] + dy).toFixed(1), t: t, c: c, anc: anc || &#x27;middle&#x27;, o: o === undefined ? &#x27;1&#x27; : o };
  }

  vl(P, dx, dy) {
    return { x: (P[0] + dx).toFixed(1), y: (P[1] + dy).toFixed(1) };
  }

  inset(legH, legV, tH, tV, tY, cH, cV, cY) {
    const s = Math.min(190 / legH, 40 / legV);
    const W = legH * s;
    const Hv = legV * s;
    const x0 = Math.max(78, (330 - W) / 2 + 24);
    const y0 = 68;
    const O = [x0, y0];
    const Hh = [x0 + W, y0];
    const V = [x0, y0 - Hv];
    const L = Math.hypot(W, Hv) || 1;
    const rs = Math.max(5, Math.min(12, W * 0.3, Hv * 0.3));
    const m = this.mid(V, Hh);
    return {
      pts: this.poly(O, Hh, V),
      rm: this.poly([x0 + rs, y0], [x0 + rs, y0 - rs], [x0, y0 - rs]),
      h: { x: (x0 + W / 2).toFixed(1), y: (y0 + 16).toFixed(1), t: tH, c: cH },
      v: { x: (x0 - 8).toFixed(1), y: (y0 - Hv / 2 + 5).toFixed(1), t: tV, c: cV },
      y: { x: (m[0] + Hv / L * 18).toFixed(1), y: (m[1] - W / L * 18 + 5).toFixed(1), t: tY, c: cY }
    };
  }

  sliderRow(key, label, cls, rng, min, max, val, show, aria, setter) {
    return { label: label, cls: cls, rng: rng, min: min, max: max, val: val, show: show, aria: aria, set: setter };
  }

  D() {
    return { t: 4, r: 3, d: 6, m: &#x27;r&#x27;, phi: 20, fx: 0 };
  }

  rad(s) {
    return s.m === &#x27;d&#x27; ? s.d / 2 : s.r;
  }

  res(s) {
    const r = this.rad(s);
    return Math.sqrt(s.t * s.t + r * r);
  }

  isBulat(s) {
    return this.isInt(this.res(s));
  }

  setMode(m) {
    this.setState((st) =&gt; {
      const cur = this.S(st);
      if (cur.m === m) return null;
      if (m === &#x27;d&#x27;) return { m: &#x27;d&#x27;, d: cur.r * 2 };
      return { m: &#x27;r&#x27;, r: Math.max(1, Math.round(cur.d / 2)) };
    });
  }

  renderVals() {
    const s = this.S(this.state);
    const t = s.t;
    const r = this.rad(s);
    const dm = s.m === &#x27;d&#x27;;
    const f1 = (n) =&gt; n.toFixed(1);
    const u = Math.min(180 / r, 235 / t, 30);
    const rx = r * u;
    const ry = rx * 0.3;
    const H = t * u + ry;
    const apexY = 205 - H / 2 + 4;
    const cy = apexY + t * u;
    const cx = 250;
    const T = [cx, apexY];
    const A = [cx, cy];
    const ph = s.phi * Math.PI / 180;
    const B = [cx + rx * Math.cos(ph), cy + ry * Math.sin(ph)];
    const L = [cx - rx, cy];
    const R = [cx + rx, cy];
    const body = &#x27;M&#x27; + this.ps(L) + &#x27; L&#x27; + this.ps(T) + &#x27; L&#x27; + this.ps(R) + &#x27; A&#x27; + f1(rx) + &#x27; &#x27; + f1(ry) + &#x27; 0 0 1 &#x27; + this.ps(L) + &#x27; Z&#x27;;
    const back = &#x27;M&#x27; + this.ps(L) + &#x27; A&#x27; + f1(rx) + &#x27; &#x27; + f1(ry) + &#x27; 0 0 1 &#x27; + this.ps(R);
    const seg = (P, Q) =&gt; ({ x1: P[0].toFixed(1), y1: P[1].toFixed(1), x2: Q[0].toFixed(1), y2: Q[1].toFixed(1) });
    const dot = (P) =&gt; ({ x: P[0].toFixed(1), y: P[1].toFixed(1) });

    const r2 = r * r;
    const s2 = t * t + r2;
    const sv = Math.sqrt(s2);
    const bulat = this.isInt(sv);
    const dirAB = this.unit(A, B);
    const mTB = this.mid(T, B);
    const side = B[0] &gt;= cx ? 1 : -1;
    const nTB = this.unit(T, B);
    let nx = -nTB[1];
    let ny = nTB[0];
    if ((mTB[0] - A[0]) * nx + (mTB[1] - A[1]) * ny &lt; 0) {
      nx = -nx;
      ny = -ny;
    }
    const mAB = this.mid(A, B);

    const sliders = [
      this.sliderRow(&#x27;t&#x27;, &#x27;t&#x27;, &#x27;cD&#x27;, &#x27;sD&#x27;, 1, 12, t, t, &#x27;Tinggi kerucut t&#x27;, (e) =&gt; this.setNum(&#x27;t&#x27;, e.target.value, 1, 12)),
      dm
        ? this.sliderRow(&#x27;d&#x27;, &#x27;d&#x27;, &#x27;cA&#x27;, &#x27;sA&#x27;, 2, 20, s.d, s.d, &#x27;Diameter alas d&#x27;, (e) =&gt; this.setNum(&#x27;d&#x27;, e.target.value, 2, 20))
        : this.sliderRow(&#x27;r&#x27;, &#x27;r&#x27;, &#x27;cA&#x27;, &#x27;sA&#x27;, 1, 10, s.r, s.r, &#x27;Jari-jari alas r&#x27;, (e) =&gt; this.setNum(&#x27;r&#x27;, e.target.value, 1, 10)),
      this.sliderRow(&#x27;phi&#x27;, &#x27;B&#x27;, &#x27;cE&#x27;, &#x27;sE&#x27;, 0, 360, s.phi, s.phi + &#x27;°&#x27;, &#x27;Posisi titik B mengelilingi alas&#x27;, (e) =&gt; this.setNum(&#x27;phi&#x27;, e.target.value, 0, 360))
    ];
    const modes = [
      { m: &#x27;r&#x27;, label: &#x27;Jari-jari r&#x27; },
      { m: &#x27;d&#x27;, label: &#x27;Diameter d&#x27; }
    ].map((q) =&gt; ({
      label: q.label,
      pressed: s.m === q.m,
      cls: &#x27;btn press&#x27; + (s.m === q.m ? &#x27; on&#x27; : &#x27;&#x27;),
      pick: () =&gt; this.setMode(q.m)
    }));
    const presets = [[4, 3], [12, 5], [8, 6]].map((q) =&gt; ({
      label: &#x27;t = &#x27; + q[0] + &#x27;, r = &#x27; + q[1],
      pressed: t === q[0] &amp;&amp; r === q[1],
      cls: &#x27;btn press&#x27; + (t === q[0] &amp;&amp; r === q[1] ? &#x27; on&#x27; : &#x27;&#x27;),
      pick: () =&gt; this.commit({ t: q[0], r: q[1], d: q[1] * 2 })
    }));

    const ins = this.inset(r, t, &#x27;r = &#x27; + this.nf(r), &#x27;t = &#x27; + t, &#x27;s = &#x27; + this.nf(sv), &#x27;#1D4780&#x27;, &#x27;#6A3590&#x27;, &#x27;#B02A24&#x27;);
    const tup = [t, r].sort((x, y) =&gt; x - y);
    const l1 = dm ? &#x27;r = d ÷ 2 = &#x27; + s.d + &#x27; ÷ 2 = &#x27; + this.nf(r) : &#x27;TB² = TA² + AB²&#x27;;
    const l2 = &#x27;s² = t² + r² = &#x27; + (t * t) + &#x27; + &#x27; + this.nf(r2) + &#x27; = &#x27; + this.nf(s2);
    const l3 = bulat ? &#x27;s = √&#x27; + this.nf(s2) + &#x27; = &#x27; + this.nf(sv) : &#x27;s = √&#x27; + this.nf(s2) + &#x27; ≈ &#x27; + this.nf(sv);

    return {
      particles: this.burstParticles(),
      fxCls: this.fx(s.fx),
      body: body,
      back: back,
      tri: this.poly(T, A, B),
      ta: seg(T, A),
      ab: seg(A, B),
      tb: seg(T, B),
      rm: this.rmark(A, [cx, cy - 40], B, 12),
      dT: dot(T),
      dA: dot(A),
      dB: dot(B),
      vT: this.vl(T, 0, -14),
      vA: this.vl(A, -16, 22),
      vB: this.vl(B, dirAB[0] * 22 + (dirAB[0] &gt;= 0 ? 6 : -6), dirAB[1] * 16 + 10),
      lt: side &gt; 0 ? this.lab(this.mid(T, A), -10, 5, &#x27;t = &#x27; + t, &#x27;#6A3590&#x27;, &#x27;end&#x27;) : this.lab(this.mid(T, A), 10, 5, &#x27;t = &#x27; + t, &#x27;#6A3590&#x27;, &#x27;start&#x27;),
      lr: this.lab(mAB, 0, ry + 30 + (B[1] &gt; cy ? 0 : 0), &#x27;r = &#x27; + this.nf(r), &#x27;#1D4780&#x27;),
      ls: this.lab(mTB, nx * 24, ny * 24 + 6, &#x27;s = &#x27; + this.nf(sv), &#x27;#B02A24&#x27;),
      lg: this.lab(mTB, nx * 24, ny * 24 - 12, &#x27;garis pelukis&#x27;, &#x27;#B02A24&#x27;),
      caption: &#x27;Kerucut dengan tinggi t = &#x27; + t + &#x27; dan jari-jari r = &#x27; + this.nf(r),
      sliders: sliders,
      keyF: &#x27;s = √(t² + r²)&#x27;,
      keyT: &#x27;Garis pelukis (s) adalah garis dari puncak T ke keliling alas (garis merah). Jika diketahui d: s = √(t² + (d ÷ 2)²).&#x27;,
      modes: modes,
      presets: presets,
      boxCls: bulat ? &#x27;verdict right &#x27; + this.alt(&#x27;pop&#x27;, s.fx) : &#x27;verdict&#x27;,
      big: bulat ? &#x27;s = &#x27; + this.nf(sv) : &#x27;s ≈ &#x27; + this.nf(sv),
      l1: l1,
      l2: l2,
      l3: l3,
      l1Cls: &#x27;&#x27;, l2Cls: &#x27;&#x27;, l3Cls: &#x27;&#x27;,
      rumus: dm ? &#x27;Rumus: s = √(t² + (d ÷ 2)²)&#x27; : &#x27;Rumus: s = √(t² + r²)&#x27;,
      isBulat: bulat,
      note: &#x27;Bilangan bulat! (&#x27; + tup[0] + &#x27;, &#x27; + tup[1] + &#x27;, &#x27; + this.nf(sv) + &#x27;) adalah triple Pythagoras.&#x27;,
      inTitle: &#x27;Segitiga TAB (siku-siku di A)&#x27;,
      inPts: ins.pts, inRm: ins.rm, inH: ins.h, inV: ins.v, inY: ins.y
    };
  }
}

&lt;/script&gt;
&lt;script&gt;
DCMount(document.getElementById(&#x27;tpl&#x27;), document.getElementById(&#x27;stage&#x27;), Component, { w: 1000, h: 740 });
&lt;/script&gt;
